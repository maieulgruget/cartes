<script>
(async function () {
  const F = 'Europe/Paris', V = Socle.vent, FM = Socle.fonds, RAD = Math.PI / 180;
  const app = await Socle.creer({
    id: 'voile', racine: '../', titre: 'Sous voile', sousTitre: 'Méditerranée',

    sansNoms: ['toponyme_hydro_ponc', 'toponyme_hydro_lin', 'toponyme_oro_ponc', 'toponyme_oro_lin'],   // la carte porte ses propres noms de caps, d'îles, d'anses et de rades, hiérarchisés : ceux du fond feraient doublon
    recherche: { centre: [6.2, 42.9], rayonKm: 450 },

      { nom: 'La rade de Marseille', note: 'de l\'Estaque au cap Croisette', centre: [5.3300, 43.2800], zoom: 11.2, pitch: 0, bearing: 0 },

      { nom: 'Îles du Frioul et château d\'If', centre: [5.3120, 43.2790], zoom: 13.4, pitch: 50, bearing: -30 },
      { nom: 'Calanques', note: 'de Sormiou à Cassis', centre: [5.4700, 43.2050], zoom: 12.2, pitch: 55, bearing: 0 },
      { nom: 'La Ciotat et l\'île Verte', centre: [5.6200, 43.1650], zoom: 12.8, pitch: 45, bearing: 0 },
      { nom: 'Côte Bleue et golfe de Fos', centre: [5.0500, 43.3400], zoom: 10.8, pitch: 40, bearing: 0 },
      { nom: 'Côte Vermeille', note: 'Cerbère, Port-Vendres, Collioure', centre: [3.1300, 42.5000], zoom: 11.6, pitch: 45, bearing: -80 },
      { nom: 'Golfe du Lion', note: 'de Leucate à la Camargue', centre: [3.7500, 43.1500], zoom: 8.6, pitch: 0, bearing: 0 },
      { nom: 'Rade de Toulon', centre: [5.9300, 43.0900], zoom: 12, pitch: 45, bearing: 0 },
      { nom: 'Îles d\'Hyères', note: 'Porquerolles, Port-Cros, le Levant', centre: [6.3100, 43.0200], zoom: 11, pitch: 45, bearing: 0 },
      { nom: 'Golfe de Saint-Tropez', centre: [6.6600, 43.2700], zoom: 11.8, pitch: 45, bearing: 0 },
      { nom: 'Cannes et les îles de Lérins', centre: [7.0400, 43.5200], zoom: 12, pitch: 45, bearing: 0 },
      { nom: 'Antibes et son cap', centre: [7.1300, 43.5650], zoom: 12.6, pitch: 50, bearing: 0 },
      { nom: 'De Nice à Menton', centre: [7.3800, 43.7100], zoom: 11.2, pitch: 50, bearing: -20 },
      { nom: 'Cap Corse', centre: [9.4000, 42.8800], zoom: 9.8, pitch: 45, bearing: 0 },
      { nom: 'Calvi et la Balagne', centre: [8.7700, 42.5800], zoom: 11.4, pitch: 50, bearing: 0 },
      { nom: 'Golfe d\'Ajaccio', centre: [8.7000, 41.8700], zoom: 10.8, pitch: 45, bearing: 0 },
      { nom: 'Bouches de Bonifacio', centre: [9.1800, 41.3800], zoom: 11.4, pitch: 50, bearing: 0 }
    ],
    sources: 'Vent : prévision Open-Meteo (modèles de Météo-France), à 10 m de hauteur. Vagues, houle et température de l\'eau : modèle de vagues d\'Open-Meteo, dont la maille est de plusieurs kilomètres. Ports, caps, îles, anses et feux : BD TOPO de l\'IGN, de Cerbère à Menton et en Corse. Fonds marins : modèle bathymétrique de façade du Shom (HOMONIM, maille de 100 m). Balises, roches et épaves : contributeurs d\'OpenStreetMap, relevé incomplet. Plan et photo aérienne : IGN ; carte géologique : BRGM. Cette carte aide à préparer une sortie ; elle ne remplace ni le bulletin côtier de Météo-France, ni la carte marine et les Instructions nautiques du Shom.'
  });
  const map = app.map;

  // ---------- Lieux : ports, anses, îles, caps et feux (BD TOPO de l'IGN, fichier préparé par relais/lieux.py) ----------
  // Chaque lieu a un rang d'apparition : 0 se voit de toute la côte, 3 seulement de près.
  let LIEUX = [
    ['Vieux-Port', 'port', 5.3638, 43.2934, 0], ['Port du Frioul', 'port', 5.3083, 43.2785, 1], ['Pointe Rouge', 'port', 5.3671, 43.2450, 2],
    ['L\'Estaque', 'port', 5.3140, 43.3589, 1], ['Cassis', 'port', 5.5351, 43.2138, 1], ['La Ciotat', 'port', 5.6092, 43.1704, 0],
    ['Île de Riou', 'île', 5.3809, 43.1783, 1], ['Île du Planier', 'île', 5.2299, 43.1987, 1], ['Cap Croisette', 'cap', 5.3371, 43.2146, 0], ['Cap Couronne', 'cap', 5.0530, 43.3247, 0]
  ];
  let lieuxComplets = false;
  try { const r = await fetch('lieux.json'); if (r.ok) { const j = await r.json(); if (j.lieux && j.lieux.length > 50) { LIEUX = j.lieux; lieuxComplets = true; } } } catch (e) { /* liste réduite de secours */ }
  LIEUX = LIEUX.map(l => ({ nom: l[0], type: l[1], lon: l[2], lat: l[3], rang: l[4], detail: l[5] || '' }));
  const rangVisible = z => z < 8.2 ? 0 : z < 10.3 ? 1 : z < 12.2 ? 2 : 3;
  const milles = km => km / 1.852, nm = v => v < 10 ? v.toFixed(1).replace('.', ',') : Math.round(v), mi = v => nm(v) + (v < 1.95 ? ' mille' : ' milles');
  const cap = (a, b) => (Math.atan2((b[0] - a[0]) * Math.cos((a[1] + b[1]) / 2 * RAD), b[1] - a[1]) / RAD + 360) % 360;
  const hh = iso => iso.slice(11, 13) + ' h';
  const fr = v => String(v).replace('.', ',');
  const duree = h => { const m = Math.round(h * 60 / 5) * 5; return Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0'); };
  const fond = p => p < 10 ? fr(p.toFixed(1)) + ' m' : Math.round(p) + ' m';
  // Indice de l'heure courante dans une série horaire (heures locales).
  const maintenant = heures => { const t = new Date().toLocaleString('sv-SE', { timeZone: F }).slice(0, 13).replace(' ', 'T'); const i = heures.findIndex(x => x.slice(0, 13) >= t); return i < 0 ? 0 : i; };
  const pixelsKm = (lat, px) => 40075 * Math.cos(lat * RAD) / (512 * Math.pow(2, map.getZoom())) * px;

  // Un pictogramme par type de lieu, dessiné une fois : il sert à la carte et aux légendes.
  const TEINTES = { port: '#1a2e4a', anse: '#2a9d8f', 'île': '#b8963e', cap: '#7a8597', feu: '#f0c330' };
  const NOMS_TYPES = { port: 'port', anse: 'anse, calanque ou mouillage', 'île': 'île', cap: 'cap ou pointe', feu: 'feu ou phare' };
  function picto(type) {
    const c = document.createElement('canvas'); c.width = c.height = 56; const x = c.getContext('2d');
    x.beginPath(); x.arc(28, 28, 24, 0, 7); x.fillStyle = TEINTES[type]; x.fill(); x.lineWidth = 3; x.strokeStyle = '#fff'; x.stroke();
    x.fillStyle = '#fff'; x.strokeStyle = '#fff'; x.lineWidth = 3.5; x.lineCap = 'round'; x.lineJoin = 'round';
    if (type === 'port') {   // une ancre
      x.beginPath(); x.arc(28, 15, 4, 0, 7); x.stroke();
      x.beginPath(); x.moveTo(28, 19); x.lineTo(28, 42); x.moveTo(20, 25); x.lineTo(36, 25); x.stroke();
      x.beginPath(); x.arc(28, 30, 12, 0.12 * Math.PI, 0.88 * Math.PI); x.stroke();
    } else if (type === 'anse') {   // une anse
      x.beginPath(); x.moveTo(17, 14); x.bezierCurveTo(17, 46, 39, 46, 39, 14); x.stroke();
    } else if (type === 'île') {   // une terre sur l'eau
      x.beginPath(); x.moveTo(13, 33); x.quadraticCurveTo(28, 8, 43, 33); x.closePath(); x.fill();
      x.beginPath(); x.moveTo(13, 41); x.lineTo(43, 41); x.stroke();
    } else if (type === 'feu') {   // un phare et ses éclats
      x.fillStyle = '#1a2e4a'; x.strokeStyle = '#1a2e4a'; x.lineWidth = 3;
      x.beginPath(); x.moveTo(24, 43); x.lineTo(26, 22); x.lineTo(30, 22); x.lineTo(32, 43); x.closePath(); x.fill();
      x.beginPath(); x.arc(28, 17, 4.5, 0, 7); x.fill();
      x.beginPath(); x.moveTo(15, 12); x.lineTo(20, 15); x.moveTo(41, 12); x.lineTo(36, 15); x.moveTo(13, 20); x.lineTo(19, 20); x.moveTo(43, 20); x.lineTo(37, 20); x.stroke();
    } else { x.beginPath(); x.moveTo(15, 17); x.lineTo(43, 28); x.lineTo(15, 39); x.closePath(); x.fill(); }   // une pointe

  }
  const PICTOS = {}; for (const t in TEINTES) PICTOS[t] = picto(t);
  const legendeLieux = `<div class="legende">${Object.keys(TEINTES).map(t => `<span><img src="${PICTOS[t].toDataURL()}" alt="" style="width:16px;height:16px;vertical-align:-3px;margin-right:4px">${NOMS_TYPES[t]}</span>`).join('')}</div>`;
  const FILTRE_RANG = ['<=', ['get', 'rang'], ['step', ['zoom'], 0, 8.2, 1, 10.3, 2, 12.2, 3]];
  for (const t in PICTOS) map.addImage('lieu-' + t, PICTOS[t].getContext('2d').getImageData(0, 0, 56, 56), { pixelRatio: 2 });
  map.addSource('lieux', { type: 'geojson', data: { type: 'FeatureCollection', features: LIEUX.map(l => ({ type: 'Feature', properties: { nom: l.nom, type: l.type, rang: l.rang }, geometry: { type: 'Point', coordinates: [l.lon, l.lat] } })) } });
  map.addLayer({ id: 'lieux', type: 'symbol', source: 'lieux', filter: FILTRE_RANG,
    layout: { 'symbol-sort-key': ['+', ['get', 'rang'], ['match', ['get', 'type'], 'port', 0, 'île', 0.2, 'cap', 0.4, 'feu', 0.6, 0.8]], 'icon-image': ['concat', 'lieu-', ['get', 'type']],
      'icon-size': ['interpolate', ['linear'], ['zoom'], 6, ['match', ['get', 'rang'], 0, 0.62, 0.5], 12, ['match', ['get', 'rang'], 0, 0.9, 1, 0.82, 2, 0.72, 0.6], 15, 0.9], 'icon-padding': 1,
      'text-field': ['get', 'nom'], 'text-font': ['Source Sans Pro Regular'], 'text-size': ['match', ['get', 'rang'], 0, 13.5, 1, 12.5, 11.5], 'text-offset': [0, 1.05], 'text-anchor': 'top', 'text-optional': true, 'text-padding': 3 },
    paint: { 'text-color': '#1a2e4a', 'text-halo-color': '#ffffff', 'text-halo-width': 2 } });

  // ---------- Balises, feux et dangers (OpenStreetMap) ----------
  /* Deux sources. D'abord un fichier du dépôt (voile/balises.json), relevé pour toute la côte par relais/balises.py :
     il se lit d'un coup, même quand le service d'OpenStreetMap sature. Tant que ce fichier n'existe pas, la lecture
     directe du service, zone par zone, auprès de plusieurs serveurs l'un après l'autre. */
  const GENRES = {
    babord: ['marque latérale bâbord', '#d62828', '#ffffff', ''], tribord: ['marque latérale tribord', '#2a9d55', '#ffffff', ''],
    nord: ['cardinale nord', '#f2c80f', '#111111', 'N'], sud: ['cardinale sud', '#f2c80f', '#111111', 'S'], est: ['cardinale est', '#f2c80f', '#111111', 'E'], ouest: ['cardinale ouest', '#f2c80f', '#111111', 'O'],
    isole: ['danger isolé', '#111111', '#d62828', ''], saines: ['eaux saines', '#ffffff', '#d62828', ''], speciale: ['marque spéciale', '#f2c80f', '#8a6d00', ''],
    feu: ['feu', '#fff3b0', '#b8963e', ''], roche: ['roche', '#e4572e', '#ffffff', 'R'], epave: ['épave ou obstruction', '#e4572e', '#ffffff', 'É']
  };
  const DANGERS = new Set(['roche', 'epave', 'isole']);
  const SERVEURS = ['https://overpass-api.de/api/interpreter', 'https://overpass.private.coffee/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
  const balises = { bornes: null, liste: [], fichier: null, date: '' };
  function genre(t) {
    const ty = t['seamark:type'] || '';
    if (/lateral/.test(ty)) { const c = t['seamark:buoy_lateral:category'] || t['seamark:beacon_lateral:category'] || ''; return /starboard/.test(c) ? 'tribord' : /port/.test(c) ? 'babord' : null; }
    if (/cardinal/.test(ty)) { const c = t['seamark:buoy_cardinal:category'] || t['seamark:beacon_cardinal:category'] || ''; return { north: 'nord', south: 'sud', east: 'est', west: 'ouest' }[c] || null; }
    if (/isolated_danger/.test(ty)) return 'isole'; if (/safe_water/.test(ty)) return 'saines'; if (/special_purpose/.test(ty)) return 'speciale';
    if (/^light/.test(ty) || (ty === 'landmark' && t['seamark:light:character'])) return 'feu';
    if (ty === 'rock') return 'roche'; if (ty === 'wreck' || ty === 'obstruction') return 'epave';
    return null;
  }
  // Rang d'apparition d'une marque : les grands feux de loin, les cardinales et les dangers ensuite, les latérales de près.
  const rangBalise = (g, portee) => g === 'feu' ? (portee >= 15 ? 1 : portee >= 8 ? 2 : 3) : (DANGERS.has(g) || ['nord', 'sud', 'est', 'ouest', 'saines'].includes(g)) ? 2 : 3;
  async function lireFichier() {
    if (balises.fichier !== null) return balises.fichier;
    try {
      const r = await fetch('balises.json'); if (!r.ok) throw new Error(r.status);
      const j = await r.json(); if (!j.liste || j.liste.length < 20) throw new Error('fichier vide');
      balises.liste = j.liste.map(b => ({ g: b[0], lon: b[1], lat: b[2], nom: b[3] || '', feu: b[4] || '', rang: b[5] || rangBalise(b[0], 0) })).filter(b => GENRES[b.g]);
      balises.date = j.date || ''; balises.fichier = true;
    } catch (e) { balises.fichier = false; }
    return balises.fichier;
  }
  // Lit les balises de l'emprise b = [ouest, sud, est, nord] si elle n'est pas déjà couverte. Renvoie faux en cas d'échec.
  async function lireBalises(b) {
    if (await lireFichier()) return true;
    const k = balises.bornes; if (k && b[0] >= k[0] && b[1] >= k[1] && b[2] <= k[2] && b[3] <= k[3]) return true;
    const mx = (b[2] - b[0]) * 0.3, my = (b[3] - b[1]) * 0.3, e = [b[0] - mx, b[1] - my, b[2] + mx, b[3] + my], bb = `(${e[1].toFixed(4)},${e[0].toFixed(4)},${e[3].toFixed(4)},${e[2].toFixed(4)})`;
    const q = `[out:json][timeout:25];(node["seamark:type"]${bb};way["seamark:type"~"rock|wreck|obstruction"]${bb};);out center 1500;`;
    for (const srv of SERVEURS) {
      try {
        const ctl = new AbortController(), minuterie = setTimeout(() => ctl.abort(), 14000);
        const r = await fetch(srv + '?data=' + encodeURIComponent(q), { signal: ctl.signal }); clearTimeout(minuterie); if (!r.ok) throw new Error(r.status);
        const j = await r.json();
        balises.liste = (j.elements || []).map(el => { const t = el.tags || {}, g = genre(t), lon = el.lon != null ? el.lon : el.center && el.center.lon, lat = el.lat != null ? el.lat : el.center && el.center.lat; if (!g || lon == null) return null;
          const feu = t['seamark:light:character'] ? [t['seamark:light:character'], t['seamark:light:colour'], t['seamark:light:period'] ? t['seamark:light:period'] + ' s' : '', t['seamark:light:range'] ? t['seamark:light:range'] + ' milles' : ''].filter(Boolean).join(' · ') : '';
          return { g, lon, lat, nom: t['seamark:name'] || t.name || '', feu, rang: rangBalise(g, +t['seamark:light:range'] || 0) }; }).filter(Boolean);
        balises.bornes = e; return true;
      } catch (err) { /* serveur suivant */ }
    }
    return false;
  }
  function dessinerBalises() {
    const fc = { type: 'FeatureCollection', features: balises.liste.map((x, i) => ({ type: 'Feature', properties: { i, g: x.g, rang: balises.fichier ? x.rang : 0, fond: GENRES[x.g][1], bord: GENRES[x.g][2], lettre: GENRES[x.g][3] }, geometry: { type: 'Point', coordinates: [x.lon, x.lat] } })) };
    if (map.getSource('balises')) { map.getSource('balises').setData(fc); return; }
    map.addSource('balises', { type: 'geojson', data: fc });
    const filtre = ['<=', ['get', 'rang'], ['step', ['zoom'], 1, 10.5, 2, 12.6, 3]];
    map.addLayer({ id: 'balises', type: 'circle', source: 'balises', filter: filtre, paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 8, 3, 10, 3.8, 14, 7.5], 'circle-color': ['get', 'fond'], 'circle-stroke-color': ['get', 'bord'], 'circle-stroke-width': 2 } });
    map.addLayer({ id: 'balises-lettre', type: 'symbol', source: 'balises', minzoom: 12, filter: ['all', filtre, ['!=', ['get', 'lettre'], '']], layout: { 'text-field': ['get', 'lettre'], 'text-font': ['Source Sans Pro Regular'], 'text-size': 10, 'text-allow-overlap': true }, paint: { 'text-color': ['match', ['get', 'g'], ['roche', 'epave'], '#ffffff', '#111111'] } });
  }
  const oterBalises = () => { app.retirer('balises-lettre', 'balises'); };
  // Distance (milles) d'un point à un tronçon, en géométrie plane locale.
  function ecart(p, a, b) {
    const k = Math.cos(p[1] * RAD), ax = (a[0] - p[0]) * k, ay = a[1] - p[1], bx = (b[0] - p[0]) * k, by = b[1] - p[1], dx = bx - ax, dy = by - ay, n = dx * dx + dy * dy;
    const t = n ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / n)) : 0;
    return Math.hypot(ax + dx * t, ay + dy * t) * 60;   // un degré de latitude fait soixante milles
  }

  // ---------- Le bateau, en volume ----------
  /* Un voilier de dix mètres en prismes : coque, pont, rouf, mât, grand-voile et foc (chaque voile en tranches de hauteur
     décroissante). Il est tourné au cap, les voiles débordées sous le vent selon l'allure. De loin il serait invisible :
     il est grossi pour garder une soixantaine de pixels de long, et retrouve sa taille réelle quand on s'approche. */
  const bateau = { p: null, cap: 0, vent: null, pose: false };
  function prismesBateau() {
    const P = [], coque = [[0, 5.2], [0.9, 3.6], [1.45, 1.4], [1.6, -1], [1.45, -3.6], [1.05, -4.9], [-1.05, -4.9], [-1.45, -3.6], [-1.6, -1], [-1.45, 1.4], [-0.9, 3.6]];
    const reduit = (pts, k) => pts.map(q => [q[0] * k, q[1] * k + 0.1]);
    P.push({ pts: coque, b: 0, h: 1.05, c: '#1a2e4a' }, { pts: reduit(coque, 0.94), b: 1.05, h: 1.2, c: '#f1ece0' }, { pts: [[-0.85, -2.2], [0.85, -2.2], [0.8, 1.0], [-0.8, 1.0]], b: 1.2, h: 1.8, c: '#dcd5c2' },
      { pts: [[-0.09, 1.11], [0.09, 1.11], [0.09, 1.29], [-0.09, 1.29]], b: 1.2, h: 13.2, c: '#b9b2a0' });
    // Angle des voiles avec l'axe du bateau : la moitié de l'angle du vent, bornée ; côté sous le vent.
    const e = bateau.vent == null ? 30 : ((bateau.vent - bateau.cap + 540) % 360) - 180, phi = Math.max(8, Math.min(78, Math.abs(e) / 2)) * RAD, cote = e >= 0 ? -1 : 1;
    const tranche = (a, b2, ep, base, haut, coul) => { const dx = b2[0] - a[0], dy = b2[1] - a[1], l = Math.hypot(dx, dy) || 1, nx = -dy / l * ep, ny = dx / l * ep; P.push({ pts: [[a[0] - nx, a[1] - ny], [b2[0] - nx, b2[1] - ny], [b2[0] + nx, b2[1] + ny], [a[0] + nx, a[1] + ny]], b: base, h: haut, c: coul }); };
    const N = 18, mat = [0, 1.2], bome = [cote * Math.sin(phi) * 4.4, 1.2 - Math.cos(phi) * 4.4];

      // Une position (réelle ou rejouée) : le bateau, son sillage, la vue et le tableau de bord.
      const position = async (p, nd, capGps, simule) => {
        if (app.active !== qMer2) return;
        if (capGps != null && !isNaN(capGps) && (nd == null || nd > 0.7)) capBateau = capGps;
        else if (dernier && app.distKm(dernier, p) > 0.02) capBateau = cap(dernier, p);
        if (!dernier || app.distKm(dernier, p) > 0.02) dernier = p;
        if (!sillage.length || app.distKm(sillage[sillage.length - 1], p) > 0.01) { sillage.push(p); if (sillage.length > 400) sillage.shift(); }
        const tr = { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: sillage.length > 1 ? sillage : [p, p] } };
        if (map.getSource('sillage')) map.getSource('sillage').setData(tr);
        else { map.addSource('sillage', { type: 'geojson', data: tr, lineMetrics: true }); map.addLayer({ id: 'sillage', type: 'line', source: 'sillage', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-width': 5, 'line-gradient': ['interpolate', ['linear'], ['line-progress'], 0, 'rgba(255,255,255,0)', 1, 'rgba(255,255,255,0.9)'] } }); }
        if (Date.now() - tVent > 6e5) { tVent = Date.now(); vent = await V.pointVent(app, p[0], p[1], F); if (app.active !== qMer2) return; }
        const i = vent ? maintenant(vent.heures) : 0;
        placerBateau(p, capBateau, vent ? vent.dir[i] : null);
        if (suivre) map.easeTo({ center: p, zoom: Math.max(map.getZoom(), 13.5), pitch: 58, bearing: capHaut ? capBateau - 28 : map.getBearing(), duration: simule ? 380 : 900, easing: t => t });
        if (Date.now() - tProf > 20000 || (pProf && app.distKm(pProf, p) > 0.15)) { tProf = Date.now(); pProf = p; FM.profondeur(p[0], p[1], true).then(v => { prof = v; }).catch(() => { }); }
        const e = vent ? ((vent.dir[i] - capBateau + 540) % 360) - 180 : null, cl = e == null ? null : classeAllure(Math.abs(e));
        const pres = LIEUX.filter(l => l.type === 'port').map(l => ({ l, d: milles(app.distKm(p, [l.lon, l.lat])), cap: cap(p, [l.lon, l.lat]) })).sort((a, b) => a.d - b.d)[0];
        c.querySelector('.etat').innerHTML = (simule ? '<span class="fort">Route rejouée</span>, en accéléré. ' : '') + (vent ? `Vent prévu ici : <span class="fort">${Math.round(vent.kn[i])} nœuds</span> de ${V.rose(vent.dir[i])}, rafales ${Math.round(vent.raf[i])}. ` : '') + (pres ? `Port le plus proche : ${app.propre(pres.l.nom)}, à ${mi(pres.d)} au ${Math.round(pres.cap)}°.` : '');
        const tirant = FM.tirant;
        c.querySelector('.tab').innerHTML = `<div><b>${nd == null ? '–' : fr(nd.toFixed(1))}</b>nœuds</div><div><b>${Math.round(capBateau)}°</b>route ${V.rose(capBateau)}</div><div><b${cl ? ` style="color:${cl[2]}"` : ''}>${cl ? cl[1] : '–'}</b>${e == null ? 'allure' : Math.round(Math.abs(e)) + '° du vent'}</div><div><b${tirant && prof < tirant + 1 ? ' style="color:#e4572e"' : ''}>${prof === prof ? fond(prof) : '–'}</b>de fond</div>`;
      };
      c.querySelector('.rejouer').onclick = e => {
        if (rejeu) { clearInterval(rejeu); rejeu = null; e.target.setAttribute('aria-pressed', 'false'); c.querySelector('.etat').textContent = 'Rejeu arrêté.'; return; }
        if (route.length < 2) return;
        if (veille != null) { navigator.geolocation.clearWatch(veille); veille = null; }
        e.target.setAttribute('aria-pressed', 'true'); sillage.length = 0; dernier = null; suivre = true; c.querySelector('.suivre').setAttribute('aria-pressed', 'true');
        const longs = []; let total = 0; for (let k = 1; k < route.length; k++) { const l = app.distKm(route[k - 1], route[k]); longs.push(l); total += l; }
        const pas = 0.4, n = Math.max(60, Math.round(45 / pas)); let t = 0;   // la route entière en trois quarts de minute
        rejeu = setInterval(() => {
          let d = total * t / n, k = 0; while (k < longs.length - 1 && d > longs[k]) { d -= longs[k]; k++; }
          const u = longs[k] ? Math.min(1, d / longs[k]) : 0, p = [route[k][0] + u * (route[k + 1][0] - route[k][0]), route[k][1] + u * (route[k + 1][1] - route[k][1])];
          position(p, allure5, cap(route[k], route[k + 1]), true);
          if (++t > n) { clearInterval(rejeu); rejeu = null; e.target.setAttribute('aria-pressed', 'false'); }
        }, pas * 1000);
      };
      if (!navigator.geolocation) { c.querySelector('.etat').textContent = 'Position indisponible sur cet appareil.' + (route.length > 1 ? ' Tu peux rejouer la route tracée.' : ''); return; }
      try { if (navigator.wakeLock) verrou = await navigator.wakeLock.request('screen'); } catch (e) { verrou = null; }
      veille = navigator.geolocation.watchPosition(pos => {
        if (rejeu) return;
        position([pos.coords.longitude, pos.coords.latitude], pos.coords.speed != null && pos.coords.speed >= 0 ? pos.coords.speed * 1.94384 : null, pos.coords.heading, false);
      }, () => { if (!rejeu) c.querySelector('.etat').textContent = 'Position refusée ou introuvable. Autorise la localisation pour cette page, puis rouvre le thème.' + (route.length > 1 ? ' En attendant, tu peux rejouer la route tracée.' : ''); }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
    },
    fermer(app) {
      if (veille != null) { navigator.geolocation.clearWatch(veille); veille = null; }
      if (rejeu) { clearInterval(rejeu); rejeu = null; }
      if (verrou) { try { verrou.release(); } catch (e) { } verrou = null; }
      if (qMer2._lache) map.off('dragstart', qMer2._lache);
      oterBateau(); app.retirer('sillage');
    }
  };
  app.question(qMer2);
})();
</script>
