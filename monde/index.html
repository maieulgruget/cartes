<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a2e4a">
<link rel="apple-touch-icon" href="icone-180.png">
<title>Cartes anciennes du monde</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.20.0/dist/maplibre-gl.css">
<style>
  :root { --navy:#1a2e4a; --gold:#b8963e; --papier:#f4efe4; --mer:#dfe3e2; --trait:#b9b0a0; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--mer); font-family: Garamond, "Liberation Serif", Georgia, serif; color:var(--navy); }
  #carte { position:fixed; inset:0; }
  header { position:fixed; top:calc(env(safe-area-inset-top) + 10px); left:12px; right:12px; display:flex; align-items:center; gap:8px; pointer-events:none; z-index:2; }
  header h1 { margin:0; font-size:17px; font-weight:normal; letter-spacing:.02em; background:rgba(244,239,228,.88); padding:7px 12px; border-radius:18px; pointer-events:auto; }
  .rond { text-decoration:none; pointer-events:auto; width:38px; height:38px; border-radius:50%; border:none; background:rgba(244,239,228,.92); color:var(--navy); font-size:18px; display:grid; place-items:center; box-shadow:0 1px 4px rgba(0,0,0,.15); cursor:pointer; }
  #retour { display:none; }
  body.pays #retour { display:grid; }
  #astuce { position:fixed; bottom:calc(env(safe-area-inset-bottom) + 18px); left:50%; transform:translateX(-50%); background:rgba(26,46,74,.85); color:#fff; padding:8px 14px; border-radius:16px; font-size:14px; z-index:2; transition:opacity .4s; }
  body.pays #astuce { opacity:0; pointer-events:none; }
  #fiche { position:fixed; left:0; right:0; bottom:0; z-index:3; background:var(--papier); border-radius:16px 16px 0 0; box-shadow:0 -2px 12px rgba(0,0,0,.18); padding:10px 18px calc(env(safe-area-inset-bottom) + 14px); transform:translateY(110%); transition:transform .3s ease; max-width:560px; margin:0 auto; }
  body.pays #fiche { transform:none; }
  #fiche.reduite .detail { display:none; }
  .poignee { width:40px; height:4px; border-radius:2px; background:var(--trait); margin:0 auto 8px; cursor:pointer; }
  #fiche h2 { margin:0; font-size:20px; font-weight:normal; }
  #fiche .meta { color:var(--gold); font-size:14px; margin-top:2px; }
  #fiche p { margin:8px 0; font-size:15px; line-height:1.35; }
  .ligne { display:flex; align-items:center; gap:10px; margin-top:8px; font-family: Arial, "Liberation Sans", sans-serif; font-size:13px; }
  .ligne input[type=range] { flex:1; accent-color:var(--gold); }
  .bouton { border:1px solid var(--navy); background:none; color:var(--navy); border-radius:14px; padding:5px 11px; font:inherit; cursor:pointer; text-decoration:none; display:inline-block; }
  .bouton.plein { background:var(--navy); color:#fff; }
  .etat { font-family: Arial, "Liberation Sans", sans-serif; font-size:13px; color:#6b6457; }
  #apercu { display:none; width:100%; max-height:38vh; object-fit:contain; background:#e9e2d2; border-radius:8px; margin-top:8px; }
  .source { font-family: Arial, "Liberation Sans", sans-serif; font-size:12px; color:#6b6457; margin-top:10px; }
  .source a { color:inherit; }
  @media (min-width: 900px) {
    #fiche { left:auto; right:16px; bottom:16px; width:380px; border-radius:14px; transform:translateX(120%); }
    header h1 { font-size:20px; }
  }
</style>
</head>
<body>
<div id="carte"></div>
<header>
  <a class="rond" href="../" title="Toutes les cartes" aria-label="Retour à la page des cartes">⌂</a>
  <button id="retour" class="rond" title="Retour au monde" aria-label="Retour au monde">🌍</button>
  <h1>Cartes anciennes du monde</h1>
</header>
<div id="astuce">Touchez un pays doré</div>

<section id="fiche" aria-live="polite">
  <div class="poignee" title="Réduire ou déplier"></div>
  <h2 id="f-titre"></h2>
  <div class="meta" id="f-meta"></div>
  <div class="detail">
    <p id="f-phrase"></p>
    <div class="ligne" id="f-reglage">
      <span>Actuelle</span><input id="opacite" type="range" min="0" max="100" value="100" aria-label="Transparence de la carte ancienne"><span>Ancienne</span>
    </div>
    <div class="etat" id="f-etat"></div>
    <img id="apercu" alt="Aperçu du scan">
    <div class="ligne" id="f-actions"></div>
    <div class="source" id="f-source"></div>
  </div>
</section>

<script type="module">
import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.20.0/dist/maplibre-gl.mjs';
import { CARTES } from './cartes.js';

const PAYS_AVEC_CARTE = Object.keys(CARTES);
const VUE_MONDE = { center: [10, 30], zoom: innerWidth < 600 ? 1.7 : 2.2 };

const map = new maplibregl.Map({
  container: 'carte',
  style: {
    version: 8,
    projection: { type: 'globe' },
    sources: { pays: { type: 'geojson', data: './pays.geojson', promoteId: 'c' } },
    layers: [
      { id: 'fond', type: 'background', paint: { 'background-color': '#dfe3e2' } },
      { id: 'terres', type: 'fill', source: 'pays', paint: {
        'fill-color': ['case', ['in', ['get', 'c'], ['literal', PAYS_AVEC_CARTE]], '#e6d3a3', '#f4efe4'] } },
      { id: 'terres-actif', type: 'fill', source: 'pays', paint: {
        'fill-color': '#b8963e', 'fill-opacity': ['case', ['boolean', ['feature-state', 'survol'], false], 0.45, 0] } },
      { id: 'frontieres', type: 'line', source: 'pays', paint: { 'line-color': '#b9b0a0', 'line-width': 0.6 } }
    ]
  },
  ...VUE_MONDE,
  attributionControl: { compact: true, customAttribution: 'Frontières : Natural Earth' }
});

// ---------- couche ancienne ----------
let paysCourant = null;
let warpedLayer = null;     // couche Allmaps, créée à la demande
let allmapsModule = null;
let opacite = 1;

async function chargerAllmaps() {
  if (!allmapsModule) allmapsModule = await import('https://cdn.jsdelivr.net/npm/@allmaps/maplibre@1.0.0-beta.44/+esm');
  return allmapsModule;
}

function retirerAncienne() {
  if (map.getLayer('ancienne')) map.removeLayer('ancienne');
  if (map.getSource('ancienne')) map.removeSource('ancienne');
  if (warpedLayer && map.getLayer(warpedLayer.id)) map.removeLayer(warpedLayer.id);
  warpedLayer = null;
}

function appliquerOpacite() {
  if (map.getLayer('ancienne')) map.setPaintProperty('ancienne', 'raster-opacity', opacite);
  if (warpedLayer) warpedLayer.setOpacity(opacite);
}

// Identifiant Allmaps = 16 premiers caractères du SHA-1 de l'id du manifeste
async function idAllmaps(texte) {
  const h = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(texte));
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
}

function serviceImage(m) {
  try { // IIIF 3
    const corps = m.items[0].items[0].items[0].body;
    const s = Array.isArray(corps.service) ? corps.service[0] : corps.service;
    return s.id || s['@id'];
  } catch (e) {}
  try { // IIIF 2
    const s = m.sequences[0].canvases[0].images[0].resource.service;
    return s['@id'] || s.id;
  } catch (e) {}
  return null;
}

async function afficherIiif(c) {
  const etat = document.getElementById('f-etat');
  const apercu = document.getElementById('apercu');
  const actions = document.getElementById('f-actions');
  if (!c.manifeste) {
    document.getElementById('f-reglage').style.display = 'none';
    actions.querySelector('.voir')?.remove();
    etat.textContent = 'Scan repéré, manifeste IIIF encore à renseigner.';
    return;
  }
  const editeur = 'https://editor.allmaps.org/#/collection?url=' + encodeURIComponent(c.manifeste);
  etat.textContent = 'Recherche du calage…';
  let manifeste = null;
  try { manifeste = await (await fetch(c.manifeste)).json(); } catch (e) {}
  const idManifeste = manifeste ? (manifeste.id || manifeste['@id'] || c.manifeste) : c.manifeste;
  const urlAnnot = 'https://annotations.allmaps.org/manifests/' + await idAllmaps(idManifeste);

  let cale = false;
  try { cale = (await fetch(urlAnnot)).ok; } catch (e) {}
  if (paysCourant !== c) return; // l'utilisateur a changé de pays entre-temps

  if (cale) {
    const { WarpedMapLayer } = await chargerAllmaps();
    if (paysCourant !== c) return;
    warpedLayer = new WarpedMapLayer({ layerId: 'ancienne-allmaps' });
    map.addLayer(warpedLayer, 'frontieres');
    await warpedLayer.addGeoreferenceAnnotationByUrl(urlAnnot);
    appliquerOpacite();
    etat.textContent = '';
    document.getElementById('f-reglage').style.display = '';
  } else {
    document.getElementById('f-reglage').style.display = 'none';
    actions.querySelector('.voir')?.remove();
    etat.textContent = 'Pas encore calée sur le monde actuel : voici le scan.';
    const service = manifeste && serviceImage(manifeste);
    if (service) {
      apercu.src = service.replace(/\/$/, '') + '/full/800,/0/default.jpg';
      apercu.style.display = 'block';
    }
    const a = document.createElement('a');
    a.className = 'bouton plein'; a.href = editeur; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = 'Caler dans Allmaps';
    actions.prepend(a);
  }
}

function ouvrirPays(code) {
  const c = CARTES[code];
  if (!c) return;
  retirerAncienne();
  paysCourant = c;
  document.body.classList.add('pays');
  document.getElementById('fiche').classList.remove('reduite');
  document.getElementById('f-titre').textContent = c.titre;
  document.getElementById('f-meta').textContent = `${c.auteur} · ${c.date}`;
  document.getElementById('f-phrase').textContent = c.phrase;
  document.getElementById('f-etat').textContent = '';
  document.getElementById('f-reglage').style.display = '';
  const apercu = document.getElementById('apercu');
  apercu.style.display = 'none'; apercu.removeAttribute('src');
  const actions = document.getElementById('f-actions');
  actions.innerHTML = '';
  const masquer = document.createElement('button');
  masquer.className = 'bouton voir'; masquer.textContent = 'Voir dessous';
  masquer.onpointerdown = () => { if (map.getLayer('ancienne')) map.setPaintProperty('ancienne', 'raster-opacity', 0); if (warpedLayer) warpedLayer.setOpacity(0); };
  masquer.onpointerup = masquer.onpointerleave = appliquerOpacite;
  actions.append(masquer);
  document.getElementById('f-source').innerHTML = `Source : <a href="${c.lien}" target="_blank" rel="noopener">${c.source}</a>`;

  map.setProjection({ type: 'mercator' });
  map.flyTo({ ...c.vue, duration: 1800, essential: true });

  if (c.type === 'flux') {
    map.addSource('ancienne', { type: 'raster', tiles: [c.tuiles], tileSize: 256, minzoom: c.minzoom, maxzoom: c.maxzoom, attribution: c.source });
    map.addLayer({ id: 'ancienne', type: 'raster', source: 'ancienne', paint: { 'raster-opacity': opacite, 'raster-fade-duration': 150 } }, 'frontieres');
  } else {
    afficherIiif(c);
  }
}

function retourMonde() {
  retirerAncienne();
  paysCourant = null;
  document.body.classList.remove('pays');
  map.setProjection({ type: 'globe' });
  map.flyTo({ ...VUE_MONDE, duration: 1600 });
}

// ---------- interactions ----------
map.on('click', 'terres', e => {
  const code = e.features[0].properties.c;
  if (CARTES[code]) ouvrirPays(code);
});
let survol = null;
map.on('mousemove', 'terres', e => {
  const code = e.features[0].properties.c;
  map.getCanvas().style.cursor = CARTES[code] ? 'pointer' : '';
  if (survol && survol !== code) map.setFeatureState({ source: 'pays', id: survol }, { survol: false });
  survol = CARTES[code] ? code : null;
  if (survol) map.setFeatureState({ source: 'pays', id: survol }, { survol: true });
});
map.on('mouseleave', 'terres', () => {
  map.getCanvas().style.cursor = '';
  if (survol) map.setFeatureState({ source: 'pays', id: survol }, { survol: false });
  survol = null;
});

document.getElementById('retour').onclick = retourMonde;
document.querySelector('.poignee').onclick = () => document.getElementById('fiche').classList.toggle('reduite');
document.getElementById('opacite').oninput = e => { opacite = e.target.value / 100; appliquerOpacite(); };

// lien direct : …/monde-historique/#FRA
map.on('load', () => {
  const code = location.hash.slice(1).toUpperCase();
  if (CARTES[code]) ouvrirPays(code);
});
window.addEventListener('hashchange', () => {
  const code = location.hash.slice(1).toUpperCase();
  if (CARTES[code]) ouvrirPays(code); else if (!code) retourMonde();
});
</script>
</body>
</html>
