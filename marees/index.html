<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>Marées — de Bréhat au cap Fréhel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="../socle/socle.css">
<script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>
<script src="../socle/socle.js"></script>
<script src="../socle/soleil.js"></script>
<script src="../socle/trace.js"></script>
</head>
<body>
<script>
(async function () {
  const app = await Socle.creer({
    id: 'marees', racine: '../', titre: 'Où est la mer', sousTitre: 'De Bréhat au cap Fréhel',
    centre: [-2.6500, 48.5350], zoom: 11.8, pitch: 45, bearing: -10, pitch3d: 50, exageration: 2,
    recherche: { centre: [-2.65, 48.65], rayonKm: 70 },
    maison: { nom: 'Kersaint', centre: [-2.6761, 48.5264], zoom: 14.5 },
    signets: [
      { nom: 'Toute la côte', note: 'de Bréhat au cap Fréhel', centre: [-2.66, 48.70], zoom: 9.6, pitch: 0, bearing: 0 },
      { nom: 'Anse d\'Yffiniac et Hillion', note: 'le fond de la baie de Saint-Brieuc', centre: [-2.6700, 48.5200], zoom: 12.6, pitch: 0, bearing: 0 },
      { nom: 'Anse de Morieux', centre: [-2.6050, 48.5300], zoom: 13, pitch: 0, bearing: 0 },
      { nom: 'Le Val-André et Dahouët', centre: [-2.5650, 48.5900], zoom: 13.2, pitch: 0, bearing: 0 },
      { nom: 'Erquy', centre: [-2.4650, 48.6350], zoom: 12.8, pitch: 0, bearing: 0 },
      { nom: 'Cap Fréhel et Fort la Latte', centre: [-2.3100, 48.6750], zoom: 12.6, pitch: 0, bearing: 0 },
      { nom: 'Binic et Saint-Quay-Portrieux', centre: [-2.8150, 48.6250], zoom: 12.4, pitch: 0, bearing: 0 },
      { nom: 'Paimpol', centre: [-3.0300, 48.7800], zoom: 12.6, pitch: 0, bearing: 0 },
      { nom: 'Île de Bréhat', centre: [-2.9950, 48.8480], zoom: 13, pitch: 0, bearing: 0 }
    ],
    sources: 'Relief de l\'estran et petits fonds : RGE ALTI de l\'IGN (qui intègre le relevé Litto3D), lu à la volée. Hauteur de mer : modèle de marée d\'Open-Meteo, au point de référence le plus proche de la vue. Pour un jour hors de sa fenêtre (une semaine), la marée est calculée à partir d\'un an de ce modèle ; ce n\'est pas l\'annuaire du Shom, et l\'écart peut atteindre plusieurs dizaines de centimètres et de minutes, davantage par vent fort ou basse pression. Les hauteurs sont données par rapport au niveau des cartes terrestres (NGF), pas au zéro des cartes marines. Oiseaux : observations publiées sur GBIF.org (eBird, iNaturalist, suivis français) ; périmètres protégés : INPN. Carte de curiosité et de préparation : pour traverser un estran, se fier aux horaires officiels et garder une large marge.'
  });
  const { map } = app;
  // Points de référence au large, pour le modèle de marée.
  const REFS = [{ nom: 'Bréhat', p: [-2.95, 48.88] }, { nom: 'Saint-Quay', p: [-2.75, 48.67] }, { nom: 'baie de Saint-Brieuc', p: [-2.62, 48.62] }, { nom: 'Erquy et Fréhel', p: [-2.40, 48.70] }];
  const DECAL = 0.45;   // niveau moyen de la mer au-dessus du zéro NGF sur cette côte (ordre de grandeur, à affiner)
  const series = new Map();
  /* Marée d'un jour quelconque. On lit un an de hauteurs horaires du modèle, puis on y ajuste les ondes de marée
     (moindres carrés sur 23 ondes) : la marée astronomique se prolonge alors à n'importe quelle date.
     Contrôle fait sur 30 jours tenus à l'écart : écart type de 18 cm, 60 cm au pire. Dans la fenêtre du modèle
     (jusqu'à une semaine devant), on garde ses valeurs, qui tiennent compte du temps qu'il fait. */
  const ONDES = [28.9841042, 30, 28.4397295, 30.0821373, 15.0410686, 13.9430356, 14.9589314, 13.3986609, 57.9682084, 58.9841042, 57.4238337, 86.9523127,
    29.5284789, 27.8953548, 27.9682084, 28.5125831, 29.9589333, 87.9682084, 43.4761563, 0.0410686, 0.0821373, 0.5443747, 1.0980331].map(v => v * Math.PI / 180);   // radians par heure
  function ajuster(tt, hh) {
    const n = 2 * ONDES.length + 1, A = Array.from({ length: n }, () => new Float64Array(n + 1)), ligne = new Float64Array(n), t0 = tt[0];
    for (let k = 0; k < tt.length; k++) {
      if (hh[k] !== hh[k]) continue; const x = (tt[k] - t0) / 36e5; ligne[0] = 1;
      for (let o = 0; o < ONDES.length; o++) { ligne[1 + 2 * o] = Math.cos(ONDES[o] * x); ligne[2 + 2 * o] = Math.sin(ONDES[o] * x); }
      for (let a = 0; a < n; a++) { const la = ligne[a], Aa = A[a]; for (let b = a; b < n; b++) Aa[b] += la * ligne[b]; Aa[n] += la * hh[k]; }
    }
    for (let a = 0; a < n; a++) for (let b = 0; b < a; b++) A[a][b] = A[b][a];
    for (let c = 0; c < n; c++) {   // élimination de Gauss avec pivot
      let piv = c; for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
      [A[c], A[piv]] = [A[piv], A[c]]; const d = A[c][c]; if (Math.abs(d) < 1e-12) return null;
      for (let r = 0; r < n; r++) if (r !== c) { const f = A[r][c] / d; if (f) for (let b = c; b <= n; b++) A[r][b] -= f * A[c][b]; }
    }
    return { t0, c: A.map((l, a) => l[n] / l[a]) };
  }
  function predire(m, t) { const x = (t - m.t0) / 36e5; let v = m.c[0]; for (let o = 0; o < ONDES.length; o++) v += m.c[1 + 2 * o] * Math.cos(ONDES[o] * x) + m.c[2 + 2 * o] * Math.sin(ONDES[o] * x); return v; }
  const iso = d => d.toISOString().slice(0, 10);
  async function maree() {
    const c = map.getCenter(), ref = REFS.reduce((a, b) => app.distKm([c.lng, c.lat], a.p) < app.distKm([c.lng, c.lat], b.p) ? a : b);
    if (!series.has(ref.nom)) {
      app.occupe(true, 'Lecture de la marée…');
      const j = await app.meteo(`https://marine-api.open-meteo.com/v1/marine?latitude=${ref.p[1]}&longitude=${ref.p[0]}&hourly=sea_level_height_msl&timezone=GMT&start_date=${iso(new Date(Date.now() - 365 * 864e5))}&end_date=${iso(new Date(Date.now() + 6 * 864e5))}`);
      const v = j && j.hourly && j.hourly.sea_level_height_msl;
      if (v && v.some(x => x != null)) {
        const tt = j.hourly.time.map(s => Date.parse(s + ':00Z')), hh = v.map(x => x == null ? NaN : x + DECAL);
        let fin = hh.length - 1; while (fin > 0 && hh[fin] !== hh[fin]) fin--;
        series.set(ref.nom, { ref, t: tt, h: hh, fin: tt[fin], modele: ajuster(tt, hh) });
      } else series.set(ref.nom, null);
      app.occupe(false);
    }
    return series.get(ref.nom);
  }
  function niveau(s, t) {
    const i = Math.floor((t - s.t[0]) / 36e5);
    if (i < 1 || t > s.fin - 2 * 36e5 || !(s.h[i] === s.h[i])) return s.modele ? predire(s.modele, t) : NaN;   // hors de la fenêtre du modèle : marée calculée
    const f = (t - s.t[i]) / 36e5, p0 = s.h[i - 1], p1 = s.h[i], p2 = s.h[i + 1], p3 = s.h[Math.min(s.h.length - 1, i + 2)];
    return 0.5 * (2 * p1 + (p2 - p0) * f + (2 * p0 - 5 * p1 + 4 * p2 - p3) * f * f + (3 * p1 - p0 - 3 * p2 + p3) * f * f * f);   // courbe lissée passant par les valeurs horaires
  }
  const calculee = (s, t) => t > s.fin - 2 * 36e5 || t < s.t[1];
  // Jour choisi au calendrier (aaaa-mm-jj), ou rien pour « maintenant ». Les thèmes de marée partent tous de cet instant.
  let jourChoisi = null;
  const depart = () => jourChoisi ? Socle.lumiere.instant('Europe/Paris', jourChoisi, 0).getTime() : Date.now();
  const champJour = () => `<div class="ligne"><input type="date" class="jourm" value="${jourChoisi || Socle.lumiere.maintenant('Europe/Paris').jour}"><button class="nowm">Maintenant</button></div>`;
  function brancherJour(c, apres) {
    const ch = c.querySelector('.jourm'); if (!ch) return;
    ch.onchange = () => { if (ch.value) { jourChoisi = ch.value === Socle.lumiere.maintenant('Europe/Paris').jour ? null : ch.value; apres(); } };
    c.querySelector('.nowm').onclick = () => { jourChoisi = null; ch.value = Socle.lumiere.maintenant('Europe/Paris').jour; apres(); };
  }
  const mention = (s, t) => calculee(s, t) ? ' <span class="petit">Marée calculée pour cette date (sans le vent ni la pression) : compter ±20 cm, parfois 60.</span>' : '';
  function extremes(s, t0, t1) {
    const r = []; let av = niveau(s, t0), sens = 0;
    for (let t = t0 + 6e5; t <= t1; t += 6e5) { const v = niveau(s, t), ns = Math.sign(v - av); if (sens && ns && ns !== sens) r.push({ t: t - 6e5, h: av, pm: sens > 0 }); if (ns) sens = ns; av = v; }
    return r;
  }
  const hhmm = t => new Date(t).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' }).replace(':', ' h ');
  const jour = t => new Date(t).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', timeZone: 'Europe/Paris' });
  const m = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1).replace('.', ',') + ' m';
  const sansMaree = '<p>Le modèle de marée ne répond pas pour l\'instant. Le thème « Niveau » fonctionne sans lui.</p>';

  const memo = {}, masquesEstran = new Set();
  async function estran() {
    const b = app.emprise(0), cle = b.map(v => v.toFixed(4)).join();
    if (memo.cle !== cle) { app.occupe(true, 'Lecture de l\'estran…'); memo.g = await app.grille(b, 520, { couche: Socle.RGEALTI }); memo.cle = cle; app.occupe(false); }
    return memo.g;
  }
  /* La mer couvre tout ce qui est sous le niveau ; au large, le relevé n'a pas de valeur : c'est la mer.
     Le relief est relu entre les mailles (deux fois plus fin) et le bord de l'eau est fondu sur quelques centimètres
     de hauteur : le trait de côte suit le relief au lieu de dessiner des marches. */
  const toileMer = document.createElement('canvas');
  function peindreMer(g, niv, bas, haut) {
    const F = 2, W = g.w * F, H = g.h * F, z = g.z, w = g.w, h = g.h, FOND = niv - 12;
    toileMer.width = W; toileMer.height = H;
    const ctx = toileMer.getContext('2d'), im = ctx.createImageData(W, H), d = im.data, sable = bas != null;
    for (let Y = 0; Y < H; Y++) {
      const fy = Math.min(h - 1, Math.max(0, (Y + 0.5) / F - 0.5)), j0 = Math.min(h - 2, Math.floor(fy)), v = fy - j0;
      for (let X = 0; X < W; X++) {
        const fx = Math.min(w - 1, Math.max(0, (X + 0.5) / F - 0.5)), i0 = Math.min(w - 2, Math.floor(fx)), u = fx - i0, a = j0 * w + i0;
        let z00 = z[a], z10 = z[a + 1], z01 = z[a + w], z11 = z[a + w + 1];
        if (z00 !== z00) z00 = FOND; if (z10 !== z10) z10 = FOND; if (z01 !== z01) z01 = FOND; if (z11 !== z11) z11 = FOND;
        const zz = (z00 * (1 - u) + z10 * u) * (1 - v) + (z01 * (1 - u) + z11 * u) * v, k = 4 * (Y * W + X);
        let e = (niv - zz) / 0.1 + 0.5; e = e <= 0 ? 0 : e >= 1 ? 1 : e * e * (3 - 2 * e);   // part d'eau, fondue sur dix centimètres
        const s = sable && zz < haut ? 105 : 0;
        if (e === 0 && s === 0) continue;
        const prof = Math.min(1, Math.max(0, (niv - zz) / 6)), moire = 0;
        const ae = (150 + 60 * prof) * e, as = s * (1 - e), at = ae + as;
        d[k] = ((50 - 20 * prof + moire) * ae + 214 * as) / at; d[k + 1] = ((140 - 45 * prof + moire) * ae + 190 * as) / at; d[k + 2] = ((190 - 30 * prof + moire) * ae + 140 * as) / at; d[k + 3] = at;
      }
    }
    ctx.putImageData(im, 0, 0);
    app.poser('mer', g, toileMer.toDataURL('image/png'));
    app.map.setPaintProperty('mer', 'raster-resampling', 'linear');
  }

  // ---------- 1. La mer maintenant, et dans les heures qui viennent ----------
  const q1 = {
    theme: 'Marée', libelle: 'Où est la mer maintenant ?',
    aide: 'La mer couvre tout ce qui est plus bas que son niveau, sur le relevé de l\'estran de l\'IGN. Le niveau vient du modèle de marée d\'Open-Meteo ; pour un jour éloigné, il est calculé à partir d\'un an de ce modèle (écart type de 18 cm sur mon contrôle, 60 cm au pire). Ce n\'est pas l\'annuaire du Shom : compter plusieurs dizaines de centimètres et de minutes d\'écart possibles, davantage par vent fort.',
    async ouvrir(app) {
      const s = await maree(); if (!s) { app.repondre(q1.libelle, sansMaree); return; }
      const c = app.repondre(q1.libelle, champJour() + `<p class="etat"></p><div class="ligne"><button class="anim">▶ Animer 24 h</button><input type="range" class="h" min="0" max="288" value="0" style="flex:1;min-width:120px"></div><p class="horaire petit"></p>
        <div class="legende"><span><i style="background:#2c6aa8"></i>mer</span><span><i style="background:#d6be8c"></i>estran découvert</span></div>
        <p class="petit">Choisis un jour, puis glisse pour avancer sur 48 heures. Référence : ${s.ref.nom}.</p>`);
      const dessiner = async () => {
        const g = await estran(); if (app.active !== q1) return;
        if (!(niveau(s, depart()) === niveau(s, depart()))) { c.querySelector('.etat').textContent = 'La marée de ce jour ne peut pas être calculée pour l\'instant. Reviens à « Maintenant ».'; c.querySelector('.horaire').textContent = ''; return; }
        const t0 = depart(), t = t0 + c.querySelector('.h').value * 6e5, niv = niveau(s, t), ex = extremes(s, t, t + 13 * 36e5), sens = niveau(s, t + 6e5) > niv;
        const jr = extremes(s, t - 7 * 36e5, t + 7 * 36e5), haut = Math.max(...jr.filter(e => e.pm).map(e => e.h), niv), bas = Math.min(...jr.filter(e => !e.pm).map(e => e.h), niv);
        peindreMer(g, niv, bas, haut);
        c.querySelector('.etat').innerHTML = `${jour(t)} à <span class="fort">${hhmm(t)}</span> : mer à <span class="fort">${m(niv)}</span>, elle ${sens ? 'monte' : 'descend'}. ${ex.slice(0, 2).map(e => `${e.pm ? 'Pleine' : 'Basse'} mer vers ${hhmm(e.t)} (${m(e.h)})`).join(', ')}.` + mention(s, t);
        c.querySelector('.horaire').innerHTML = 'Horaire sur 24 h : ' + extremes(s, t0, t0 + 25 * 36e5).map(e => `${e.pm ? 'PM' : 'BM'} ${hhmm(e.t)} (${m(e.h)})`).join(' · ');
      };
      brancherJour(c, () => { c.querySelector('.h').value = 0; dessiner(); });
      // Animation : la mer avance de 20 minutes par image, sur 24 heures, puis s'arrête.
      const bAnim = c.querySelector('.anim'), arreter = () => { clearInterval(q1.minuterie); q1.minuterie = null; bAnim.textContent = '▶ Animer 24 h'; };
      bAnim.onclick = () => {
        if (q1.minuterie) { arreter(); return; }
        const h = c.querySelector('.h'), d0 = +h.value; bAnim.textContent = '■ Arrêter';
        q1.minuterie = setInterval(() => { if (app.active !== q1 || +h.value >= Math.min(288, d0 + 144)) { arreter(); return; } h.value = +h.value + 2; dessiner(); }, 220);
      };
      c.querySelector('.h').oninput = dessiner; app.suivre(q1, dessiner); await dessiner();
    },
    fermer(app) { clearInterval(q1.minuterie); q1.minuterie = null; app.retirer('mer'); }
  };

  // ---------- 2. Hauteur libre ----------
  let libre = 3;
  const q2 = {
    theme: 'Niveau', libelle: 'Et si la mer montait à… ?',
    aide: 'Un niveau libre, sans marée : la carte montre ce qui serait sous l\'eau si la mer était à la hauteur choisie. Les hauteurs sont celles des cartes terrestres (NGF), pas le zéro des cartes marines.',
    async ouvrir(app) {
      const c = app.repondre(q2.libelle, `<p>Mer à <span class="fort niv"></span> <span class="petit">(niveau des cartes terrestres)</span></p><input type="range" class="h" min="-70" max="90" value="${libre * 10}">
        <p class="etat petit">Repères sur cette côte : une basse mer de vive-eau descend vers −5,5 m, une pleine mer de vive-eau monte vers +6 m, et les plus grandes marées approchent +7 m. Au-delà, c'est une surcote de tempête.</p>
        <div class="legende"><span><i style="background:#2c6aa8"></i>sous l'eau</span></div>`);
      const dessiner = async () => { const g = await estran(); if (app.active !== q2) return; libre = c.querySelector('.h').value / 10; c.querySelector('.niv').textContent = m(libre); peindreMer(g, libre); };
      c.querySelector('.h').oninput = dessiner; app.suivre(q2, dessiner); await dessiner();
    },
    fermer(app) { app.retirer('mer'); }
  };

  // ---------- 3. Durée d'émersion de l'estran ----------
  const q3 = {
    theme: 'Estran', libelle: 'Combien de temps à sec ?',
    aide: 'Part du temps où chaque point de l\'estran est découvert sur les deux prochaines marées. C\'est ce qui sépare les vasières, les herbiers et le haut de plage.',
    async ouvrir(app) {
      const s = await maree(); if (!s) { app.repondre(q3.libelle, sansMaree); return; }
      const c = app.repondre(q3.libelle, champJour() + `<p class="etat"></p>
        <div class="legende"></div>
        <p class="petit">Part du temps où chaque point de l'estran est découvert sur les deux prochaines marées (environ 25 heures). C'est ce qui sépare les vasières, les herbiers et le haut de plage. Touche un point pour ses heures de passage.</p>`);
      const R = [[0, 29, 78, 137], [0.25, 79, 157, 142], [0.5, 233, 196, 106], [0.75, 244, 162, 97], [1, 241, 227, 192]];
      const masques = app.legende(c, [{ cle: 'e', couleur: '#1d4e89', texte: 'toujours sous l\'eau' }, { cle: '1', couleur: '#4f9d8e', texte: 'à sec 25 % du temps' }, { cle: '2', couleur: '#e9c46a', texte: '50 %' }, { cle: '3', couleur: '#f4a261', texte: '75 %' }, { cle: '4', couleur: '#f1e3c0', texte: 'presque toujours à sec' }], () => dessiner(), masquesEstran);
      const dessiner = async () => {
        const g = await estran(); if (app.active !== q3) return;
        const t0 = depart(), niv = []; for (let t = t0; t <= t0 + 25 * 36e5; t += 6e5) niv.push(niveau(s, t));
        niv.sort((a, b) => a - b); const bas = niv[0], haut = niv[niv.length - 1];
        let surf = 0;
        app.poser('mer', g, app.peindre(g, k => {
          const z = g.z[k]; if (!(z === z) || z <= bas) return masques.has('e') ? null : [29, 78, 137, 170]; if (z >= haut) return null;
          let lo = 0, hi = niv.length; while (lo < hi) { const mi = (lo + hi) >> 1; if (niv[mi] < z) lo = mi + 1; else hi = mi; }
          const f = lo / niv.length; surf++;
          if (masques.has(f < 0.375 ? '1' : f < 0.625 ? '2' : f < 0.875 ? '3' : '4')) return null;
          for (let i = 1; i < R.length; i++) if (f <= R[i][0]) { const a = R[i - 1], b2 = R[i], u = (f - a[0]) / (b2[0] - a[0]); return [a[1] + (b2[1] - a[1]) * u, a[2] + (b2[2] - a[2]) * u, a[3] + (b2[3] - a[3]) * u, 200]; }
        }));
        const km2 = surf * g.pas * g.pas / 1e6;
        c.querySelector('.etat').innerHTML = `Sur ces deux marées, la mer va de <span class="fort">${m(bas)}</span> à <span class="fort">${m(haut)}</span> : <span class="fort">${km2 >= 1 ? km2.toFixed(1).replace('.', ',') + ' km²' : Math.round(km2 * 100) + ' ha'}</span> d'estran se découvrent dans la vue (${jour(t0)}).` + mention(s, t0);
      };
      brancherJour(c, dessiner);
      app.suivre(q3, dessiner); await dessiner();
    },
    toucher(app, ll) { passage(ll, document.querySelector('.reponse .etat')); },
    fermer(app) { app.retirer('mer', 'pointmer'); }
  };

  // ---------- 4. Heures de passage en un point ----------
  async function passage(ll, cible) {
    const s = await maree(), g = memo.g; if (!s || !g || !cible) return;
    const k = app.indice(g, ll.lng, ll.lat); if (k < 0) return;
    const z = g.z[k], d = { type: 'Feature', geometry: { type: 'Point', coordinates: [ll.lng, ll.lat] } };
    if (map.getSource('pointmer')) map.getSource('pointmer').setData(d);
    else { map.addSource('pointmer', { type: 'geojson', data: d }); map.addLayer({ id: 'pointmer', type: 'circle', source: 'pointmer', paint: { 'circle-radius': 7, 'circle-color': '#b8963e', 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } }); }

    },
    toucher(app, ll) {
      const p = map.project(ll), f = map.getLayer('oiseaux') ? map.queryRenderedFeatures([[p.x - 14, p.y - 14], [p.x + 14, p.y + 14]], { layers: ['oiseaux'] }) : [];
      if (!f.length) return;
      const lignes = f.slice(0, 5).map(x => { const o = x.properties; return `<span class="fort">${app.propre(o.nom)}</span>${o.nb > 1 ? ' (' + o.nb + ' individus)' : ''}, ${o.jour ? o.jour + ' ' : ''}${o.mois ? MOIS[o.mois - 1] + ' ' : ''}${o.an || ''}${o.src ? ' <span class="petit2">· ' + app.propre(o.src) + '</span>' : ''}`; });
      document.querySelector('.reponse .etat').innerHTML = lignes.join('<br>') + (f.length > 5 ? `<br><span class="petit2">et ${f.length - 5} autres au même endroit</span>` : '');
    },
    fermer(app) { app.retirer('oiseaux', 'rnn', 'zps', 'mer'); }
  };
  [q1, q3, q4, q5, q6, q2].forEach(q => app.question(q));
})();
</script>
</body>
</html>
