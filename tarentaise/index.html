<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tarentaise">
<meta name="theme-color" content="#0e1622">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="../socle/icone-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../socle/icone-180.png">
<title>Versant du soleil — Les Chapelles, Tarentaise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="../socle/socle.css">
<script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>
<script src="../socle/socle.js"></script>
<script src="../socle/soleil.js"></script>
<script src="../socle/formes.js"></script>
<script src="../socle/foret.js"></script>
<script src="../socle/trace.js"></script>
</head>
<body>
<script>
(async function () {
  const ROSE = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
  const app = await Socle.creer({
    id: 'tarentaise', racine: '../', titre: 'Versant du soleil', sousTitre: 'Les Chapelles',
    centre: [6.7250, 45.6020], zoom: 12.4, pitch: 55, bearing: -25, pitch3d: 60,
    recherche: { centre: [6.7368, 45.5923], rayonKm: 60 },
    signets: [
      { nom: 'Les Chapelles et Montgirod', note: 'les villages du versant', centre: [6.7330, 45.5930], zoom: 14.2, pitch: 55, bearing: -20 },
      { nom: 'Picolard', centre: [6.7133, 45.5828], zoom: 14.6, pitch: 55, bearing: -10 },
      { nom: 'Dôme de Vaugelaz', note: 'le sommet au-dessus des villages', centre: [6.7007, 45.6106], zoom: 13.8, pitch: 62, bearing: -30 },
      { nom: 'Derrière le Dôme : col de Forclaz', centre: [6.7128, 45.6525], zoom: 13.3, pitch: 60, bearing: 160 },
      { nom: 'Fort de la Platte', centre: [6.7430, 45.6381], zoom: 13.8, pitch: 60, bearing: -40 },
      { nom: 'Pointe de la Terrasse', centre: [6.7247, 45.6702], zoom: 13.4, pitch: 62, bearing: 150 },
      { nom: 'Tout le versant, vu des Arcs', centre: [6.7300, 45.6150], zoom: 11.9, pitch: 58, bearing: -15 }
    ],
    sources: 'Relief : LiDAR HD de l\'IGN, lu à la volée. Photo aérienne et plan : IGN. Prévisions : Open-Meteo. Les pentes, les ombres et la limite du gel sont calculées dans la page, sur la vue affichée : plus la vue est rapprochée, plus la maille est fine. Outil de préparation, qui ne remplace ni le bulletin d\'avalanche de Météo-France ni le jugement sur le terrain.'
  });
  const { map } = app;

  // ---------- 1. Pentes croisées avec l'orientation et l'altitude ----------
  const choix = { seuil: 30, expos: new Set(['N', 'NE', 'E']), altMin: 1800 };
  const memoP = {}, masquesPentes = new Set();
  const qPentes = {
    theme: 'Avalanche', libelle: 'Quelles pentes éviter ?',
    aide: 'Le bulletin d\'avalanche du jour dit sur quelles orientations de versant et à partir de quelle altitude le danger est le plus marqué. L\'orientation est la direction vers laquelle la pente regarde : un versant nord tourne le dos au soleil. Elle compte parce que le vent dépose la neige sur les versants abrités de lui, et parce que le soleil transforme la neige des versants sud bien plus vite que celle des versants nord. L\'altitude compte parce que la quantité de neige et le froid changent avec elle. La pente, enfin : une plaque part surtout au-dessus de 30°. La carte colore donc les pentes qui cumulent les trois critères. Les pentes sont calculées sur le relevé LiDAR de l\'IGN ; de loin, elles sont lissées et sous-estimées, il faut zoomer sur le secteur visé. La carte ne sait rien de la neige elle-même.',
    async ouvrir(app) {
      const c = app.repondre(qPentes.libelle, `
        <p>Reporte ici le bulletin d'avalanche du jour : les orientations exposées, et l'altitude à partir de laquelle il s'applique.</p>
        <div class="ligne"><label>Orientations</label><div class="puces expos">${ROSE.map(r => `<button data-r="${r}" aria-pressed="${choix.expos.has(r)}">${r}</button>`).join('')}</div></div>
        <div class="ligne"><label>Pente à partir de</label><div class="puces seuils">${[30, 35, 40].map(s => `<button data-s="${s}" aria-pressed="${choix.seuil === s}">${s}°</button>`).join('')}</div></div>
        <div class="ligne"><label>Au-dessus de <span class="fort alt">${choix.altMin} m</span></label></div>
        <input type="range" class="altmin" min="800" max="3200" step="100" value="${choix.altMin}">
        <p class="etat"></p>
        <div class="legende"></div>`);
      const masques = app.legende(c, [{ cle: 'a', couleur: '#f4d35e', texte: '30-35°' }, { cle: 'b', couleur: '#ee964b', texte: '35-40°' }, { cle: 'c', couleur: '#e63946', texte: '40-45°' }, { cle: 'd', couleur: '#9d4edd', texte: 'plus de 45°' }, { cle: 'h', couleur: 'rgba(40,50,70,.6)', texte: 'raide, hors critères' }], () => dessiner(), masquesPentes);
      const dessiner = () => {
        const g = memoP.g, a = memoP.a; if (!g || app.active !== qPentes) return;
        let n = 0, tot = 0;
        const url = app.peindre(g, k => {
          const p = a.pente[k]; if (!(p >= 0)) return null; tot++;
          if (p < choix.seuil) return null;
          const dans = g.z[k] >= choix.altMin && choix.expos.has(ROSE[Math.round(a.expo[k] / 45) % 8]);
          if (!dans) return masques.has('h') ? null : [40, 50, 70, 70];
          n++; if (masques.has(p < 35 ? 'a' : p < 40 ? 'b' : p < 45 ? 'c' : 'd')) return null;
          return p < 35 ? [244, 211, 94, 200] : p < 40 ? [238, 150, 75, 210] : p < 45 ? [230, 57, 70, 215] : [157, 78, 221, 220];
        });
        app.poser('pentes', g, url);
        const ha = n * g.pas * g.pas / 1e4;
        c.querySelector('.etat').innerHTML = g.pas > 25 ? '<span class="fort">Zoome sur le secteur visé</span> : vues de loin, les pentes sont sous-estimées.' : 'Touche la carte pour connaître la pente et l\'orientation d\'un point.';
      };
      const recharger = async () => {
        const b = app.emprise(0), cle = b.map(v => v.toFixed(4)).join();
        if (memoP.cle !== cle) { app.occupe(true, 'Calcul des pentes…'); memoP.g = await app.grille(b, 460); memoP.a = app.pentes(memoP.g); memoP.cle = cle; app.occupe(false); }
        dessiner();
      };
      c.querySelector('.expos').onclick = e => { const r = e.target.dataset.r; if (!r) return; choix.expos.has(r) ? choix.expos.delete(r) : choix.expos.add(r); e.target.setAttribute('aria-pressed', choix.expos.has(r)); dessiner(); };
      c.querySelector('.seuils').onclick = e => { const s = +e.target.dataset.s; if (!s) return; choix.seuil = s; c.querySelectorAll('.seuils button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.s === s)); dessiner(); };
      c.querySelector('.altmin').oninput = e => { choix.altMin = +e.target.value; c.querySelector('.alt').textContent = choix.altMin + ' m'; dessiner(); };
      app.suivre(qPentes, recharger); await recharger();
    },
    toucher(app, ll) {
      const g = memoP.g, k = g ? app.indice(g, ll.lng, ll.lat) : -1; if (k < 0) return;
      const p = memoP.a.pente[k], e = memoP.a.expo[k];
      document.querySelector('.reponse .etat').innerHTML = `Ici : <span class="fort">${Math.round(g.z[k])} m</span>, pente de <span class="fort">${Math.round(p)}°</span> tournée vers le <span class="fort">${ROSE[Math.round(e / 45) % 8]}</span>.`;
    },
    fermer(app) { app.retirer('pentes'); }
  };

  // ---------- 2. Prévisions : au village et en altitude ----------
  const PT = { lat: 45.5923, lon: 6.7368 };
  const JOURS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
  const TEMPS = c => c === 0 ? 'ciel clair' : c <= 2 ? 'peu nuageux' : c === 3 ? 'couvert' : c <= 48 ? 'brouillard' : c <= 57 ? 'bruine' : c <= 67 ? 'pluie' : c <= 77 ? 'neige' : c <= 82 ? 'averses' : c <= 86 ? 'averses de neige' : 'orage';
  let previs = null;
  async function chargerPrevis() {
    if (previs) return previs;
    const base = `https://api.open-meteo.com/v1/forecast?latitude=${PT.lat}&longitude=${PT.lon}&timezone=Europe%2FParis&forecast_days=4`;
    const [village, haut] = await Promise.all([
      app.meteo(base + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum&hourly=freezing_level_height'),
      app.meteo(base + '&elevation=2200&daily=temperature_2m_max,temperature_2m_min,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant')
    ]);
    if (village) previs = { village, haut };
    return previs;
  }
  // Prévisions en un point quelconque, à son altitude réelle (lue sur le relevé LiDAR).
  async function previsA(lon, lat) {
    let alt = null, nom = null;
    try { const g = await app.grille([lon - 0.0006, lat - 0.0004, lon + 0.0006, lat + 0.0004], 16); alt = g.z[app.indice(g, lon, lat)]; if (!(alt === alt)) alt = g.zmin; } catch (e) { alt = null; }
    try { const r = await fetch(`${Socle.GEOPF}/geocodage/reverse?index=poi&lon=${lon}&lat=${lat}&limit=5`); const f = (await r.json()).features.find(f => f.properties.distance < 1500 && !/epci|département|région/.test((f.properties.category || []).join())); if (f) nom = f.properties.toponym; } catch (e) { nom = null; }
    const j = await app.meteo(`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}${alt != null && isFinite(alt) ? '&elevation=' + Math.round(alt) : ''}&timezone=Europe%2FParis&forecast_days=6&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,sunshine_duration`);
    return j && j.daily ? { d: j.daily, alt, nom } : null;
  }
  const qTemps = {
    theme: 'Météo', libelle: 'Quel temps ici ?',
    aide: 'Prévisions du modèle Open-Meteo au point touché, ramenées à son altitude réelle : la température est corrigée de l\'écart entre l\'altitude du modèle et celle du terrain. Le vent est celui du modèle à 10 m du sol, à prendre comme un ordre de grandeur, surtout sur les crêtes. La neige annoncée est un cumul sur la journée. Au-delà de trois jours, la prévision donne une tendance, pas un horaire.',
    async montrer(app, lon, lat) {
      app.occupe(true, 'Prévisions…'); const p = await previsA(lon, lat); app.occupe(false); if (app.active !== qTemps) return;
      const d0 = { type: 'Feature', geometry: { type: 'Point', coordinates: [lon, lat] } };
      if (map.getSource('pointmeteo')) map.getSource('pointmeteo').setData(d0);
      else { map.addSource('pointmeteo', { type: 'geojson', data: d0 }); map.addLayer({ id: 'pointmeteo', type: 'circle', source: 'pointmeteo', paint: { 'circle-radius': 7, 'circle-color': '#b8963e', 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } }); }
      if (!p) { app.repondre(qTemps.libelle, '<p>Les prévisions ne répondent pas pour l\'instant. Réessaie dans un moment.</p>'); return; }
      const d = p.d, jour = i => `<div><b>${JOURS[new Date(d.time[i] + 'T12:00').getDay()]} ${d.time[i].slice(8)}</b>${TEMPS(d.weather_code[i])}<br>${Math.round(d.temperature_2m_min[i])}° / ${Math.round(d.temperature_2m_max[i])}°<br>${d.snowfall_sum[i] > 0 ? '<span class="fort">' + d.snowfall_sum[i].toFixed(0) + ' cm de neige</span>' : d.precipitation_sum[i] > 0.2 ? d.precipitation_sum[i].toFixed(0) + ' mm de pluie' : 'sec'}<br>vent ${ROSE[Math.round(d.wind_direction_10m_dominant[i] / 45) % 8]} ${Math.round(d.wind_speed_10m_max[i])}, rafales ${Math.round(d.wind_gusts_10m_max[i])} km/h<br>${Math.round((d.sunshine_duration[i] || 0) / 3600)} h de soleil</div>`;
      app.repondre(qTemps.libelle, `<p><span class="fort">${app.propre(p.nom || 'Point touché')}</span>${p.alt != null && isFinite(p.alt) ? ', ' + Math.round(p.alt) + ' m' : ''} — touche un autre endroit pour changer.</p>
        <div class="jours" style="grid-template-columns:repeat(3,1fr)">${d.time.map((t, i) => jour(i)).join('')}</div>`);
    },
    async ouvrir(app) { await qTemps.montrer(app, PT.lon, PT.lat); },
    toucher(app, ll) { qTemps.montrer(app, ll.lng, ll.lat); },
    fermer(app) { app.retirer('pointmeteo'); }
  };

  // ---------- 3. Limite du gel sur le relief ----------
  const memoG = {}, masquesGel = new Set();
  const qGel = {
    theme: 'Gel', libelle: 'Où gèle-t-il ?',
    aide: 'L\'isotherme 0 °C est l\'altitude où la température de l\'air passe sous zéro. Au-dessus, il gèle : la neige reste froide et les précipitations tombent en neige ; en dessous, il dégèle et il pleut. En hiver, presque toute la montagne est au-dessus, c\'est normal : ce sont alors les teintes qui renseignent, plus on monte, plus il fait froid (environ 6,5 °C de moins par 1 000 m). L\'altitude de l\'isotherme vient du modèle de prévision ; au sol, une nuit claire fait geler plus bas, et un versant au soleil dégèle plus haut.',
    async ouvrir(app) {
      app.occupe(true, 'Prévisions…'); const p = await chargerPrevis(); app.occupe(false);
      if (!p) { app.repondre(qGel.libelle, '<p>Les prévisions ne répondent pas pour l\'instant. Réessaie dans un moment.</p>'); return; }
      const hh = p.village.hourly, maintenant = Date.now();
      let i0 = hh.time.findIndex(t => new Date(t).getTime() >= maintenant); if (i0 < 0) i0 = 0;
      const c = app.repondre(qGel.libelle, `<p>Il gèle au-dessus de <span class="fort iso"></span> <span class="quand"></span></p>
        <div class="ligne"><button class="now">Maintenant</button><input type="range" class="h" min="0" max="${hh.time.length - 1}" value="${i0}" style="flex:1;min-width:120px"></div>
        <p class="etat"></p><div class="legende"></div>`);
      const CL = [['a', '#bfe3f2', '0 à −3 °C', [191, 227, 242, 120]], ['b', '#7fb8de', '−3 à −6 °C', [127, 184, 222, 150]], ['c', '#3f7fc0', '−6 à −10 °C', [63, 127, 192, 170]], ['d', '#3b3f9e', 'sous −10 °C', [59, 63, 158, 185]]];
      const dessiner = () => {
        const g = memoG.g; if (!g || app.active !== qGel) return;
        const i = +c.querySelector('.h').value, iso = hh.freezing_level_height[i], t = new Date(hh.time[i]);
        c.querySelector('.iso').textContent = Math.round(iso / 50) * 50 + ' m';
        c.querySelector('.quand').textContent = `${JOURS[t.getDay()]} ${t.getDate()} à ${t.getHours()} h`;
        app.poser('gel', g, app.peindre(g, k => { const z = g.z[k]; if (!(z === z) || z < iso) return null; const T = -(z - iso) * 0.0065, q = T > -3 ? 0 : T > -6 ? 1 : T > -10 ? 2 : 3; return masques.has(CL[q][0]) ? null : CL[q][3]; }));
        c.querySelector('.etat').textContent = `Température de l'air estimée : environ ${Math.round(-(2200 - iso) * 0.0065)} °C à 2 200 m, ${Math.round(-(1300 - iso) * 0.0065)} °C aux Chapelles.`;
      };
      const masques = app.legende(c, CL.map(x => ({ cle: x[0], couleur: x[1], texte: x[2] })), dessiner, masquesGel);
      const recharger = async () => {
        const b = app.emprise(0), cle = b.map(v => v.toFixed(4)).join();
        if (memoG.cle !== cle) { app.occupe(true, 'Lecture du relief…'); memoG.g = await app.grille(b, 460); memoG.cle = cle; app.occupe(false); }
        dessiner();
      };
      c.querySelector('.h').oninput = dessiner;
      c.querySelector('.now').onclick = () => { c.querySelector('.h').value = i0; dessiner(); };
      app.suivre(qGel, recharger); await recharger();
    },
    fermer(app) { app.retirer('gel'); }
  };

  // ---------- Itinéraire : profil, temps, pentes traversées et dominantes, soleil ----------
  const T = Socle.traceOutils, L = Socle.lumiere;
  const qTrace = Socle.trace({
    cle: 'tarentaise', nom: 'Sortie au-dessus des Chapelles', libelle: 'Par où monter ?',
    intro: 'Touche la carte pour poser le départ, puis chaque point de passage jusqu\'au sommet.',
    pied: 'Outil de préparation : il ne remplace ni le bulletin d\'avalanche ni l\'observation du manteau neigeux.',
    async analyse(app, d) {
      const { g, a } = d, n = d.dist.length;
      // temps de montée : dénivelé et distance combinés (le plus long des deux, plus la moitié de l'autre)
      const temps = v => { const h1 = d.dplus / v, h2 = d.total / 1000 / 4; return Math.max(h1, h2) + Math.min(h1, h2) / 2; };
      // pentes traversées, par orientation
      let raide = 0, pmax = 0, imax = 0; const parExpo = {};
      for (let i = 1; i < n; i++) { const l = d.dist[i] - d.dist[i - 1], p = d.pente[i]; if (p > pmax) { pmax = p; imax = i; } if (p >= 30) { raide += l; const r = ROSE[Math.round(d.expo[i] / 45) % 8]; parExpo[r] = (parExpo[r] || 0) + l; } }
      // pentes qui dominent le tracé : la plus forte pente à moins de 80 m, plus haut que le tracé
      const r = Math.max(1, Math.round(80 / g.pas)); let dom = 0, idom = 0, nbDom = 0;
      for (let i = 0; i < n; i += 2) {
        const k = app.indice(g, d.xy[i][0], d.xy[i][1]); if (k < 0) continue; const i0 = k % g.w, j0 = (k - i0) / g.w; let m = 0;
        for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++) { const ii = i0 + di, jj = j0 + dj; if (ii < 0 || jj < 0 || ii >= g.w || jj >= g.h || di * di + dj * dj > r * r) continue; const kk = jj * g.w + ii; if (g.z[kk] > d.z[i] + 5 && a.pente[kk] > m) m = a.pente[kk]; }
        if (m >= 30) nbDom++; if (m > dom) { dom = m; idom = i; }
      }
      const partDom = Math.round(100 * nbDom / Math.ceil(n / 2));
      d.repere = pmax >= 30 ? d.xy[imax] : (dom >= 30 ? d.xy[idom] : null);
      // soleil : heure d'arrivée du soleil au départ, à mi-parcours et à l'arrivée, le jour choisi dans le thème Soleil
      if (!L.etat.jour) Object.assign(L.etat, L.maintenant('Europe/Paris'));
      const c0 = d.xy[n >> 1]; let gl = g; try { gl = await app.grille([c0[0] - 0.32, c0[1] - 0.22, c0[0] + 0.32, c0[1] + 0.22], 520); } catch (e) { gl = g; }
      const premier = i => { const k = app.indice(gl, d.xy[i][0], d.xy[i][1]); if (k < 0) return null; for (let m = 0; m < 1440; m += 5) { const s = app.soleil(L.instant('Europe/Paris', L.etat.jour, m), d.xy[i][1], d.xy[i][0]); if (app.eclaire(gl, k, s.azimut, s.hauteur)) return m; } return null; };
      const sol = [['départ', 0], ['mi-parcours', n >> 1], ['arrivée', n - 1]].map(([nom, i]) => { const m = premier(i); return `${nom} ${m == null ? 'sans soleil' : 'à ' + L.hm(m)}`; });
      const expos = Object.entries(parExpo).sort((x, y) => y[1] - x[1]).map(([k, v]) => `${k} ${T.km(v)}`).join(', ');
      return `<p>Montée : environ <span class="fort">${T.duree(temps(400))}</span> à 400 m/h, ${T.duree(temps(300))} à 300 m/h, pauses non comprises.</p>
        <p>${raide > 0 ? `Le tracé passe <span class="fort">${T.km(raide)}</span> sur des pentes de 30° ou plus (en rouge), orientées ${expos}. Pente la plus forte sous les skis : <span class="fort">${Math.round(pmax)}°</span> vers ${Math.round(d.z[imax])} m (point rouge).` : `Le tracé reste sous 30° de pente : au plus <span class="fort">${Math.round(pmax)}°</span>, vers ${Math.round(d.z[imax])} m.`}</p>
        <p>${dom >= 30 ? `Au-dessus du tracé, à moins de 80 m, la pente atteint <span class="fort">${Math.round(dom)}°</span> vers ${Math.round(d.z[idom])} m ; <span class="fort">${partDom} %</span> du parcours passe sous une pente de 30° ou plus.` : 'Aucune pente de 30° ou plus ne domine le tracé à moins de 80 m.'}</p>
        <p>Soleil le ${L.etat.jour.split('-').reverse().join('/')} : ${sol.join(', ')}.</p>
        <p class="petit">Maille de calcul : ${Math.round(g.pas)} m. Un tracé posé en quelques points coupe droit entre eux : ajoute des points dans les passages raides. Les pentes au-delà de 80 m (couloirs, grandes faces) ne sont pas comptées. L'heure du soleil tient compte des crêtes jusqu'à 25 km, sur une maille d'une centaine de mètres.</p>`;
    }
  });
  app.question(qTrace);
  app.question(qPentes);
  app.question(Socle.lumiere.lumiere({ theme: 'Soleil', libelle: 'Où est le soleil à cette heure ?', fuseau: 'Europe/Paris', note: 'Neige de printemps ou versant resté à l\'ombre : l\'heure d\'arrivée du soleil décide de la qualité de la neige.' }));
  app.question(Socle.lumiere.duree({ fuseau: 'Europe/Paris', noteDuree: 'Un versant qui ne voit le soleil que deux heures en décembre garde sa neige froide.' }));
  app.question(qGel);
  app.question(qTemps);
  app.question(Socle.formes());
  app.question(Socle.foret({ note: 'En lisière haute, les mélèzes et les aulnes verts signalent souvent les couloirs.' }));
})();
</script>
</body>
</html>
