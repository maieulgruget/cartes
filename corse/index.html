<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Corse">
<meta name="theme-color" content="#0e1622">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-180.png">
<title>Mes randos en Corse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="../socle/socle.css">
<script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>
<script src="../socle/socle.js"></script>
<script src="../socle/soleil.js"></script>
<script src="../socle/trace.js"></script>
<style>
  .randos-liste { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
  .randos-liste button { flex: none; text-align: left; border-radius: 12px; max-width: 13.5em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .randos-liste button small { overflow: hidden; text-overflow: ellipsis; }
  .randos-liste button small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 400; }
  .randos-liste button[aria-pressed="true"] small { color: #3a3524; }
  .barres { margin: 6px 0 2px; font-size: 12px; }
  .barres b { display: block; font-weight: 600; color: var(--muted); margin: 6px 0 2px; }
  .barres div { display: grid; grid-template-columns: 9.5em 1fr 4.2em; gap: 6px; align-items: center; margin: 2px 0; }
  .barres div i { display: block; height: 8px; border-radius: 4px; background: var(--gold); min-width: 2px; }
  .barres div span:last-child { text-align: right; white-space: nowrap; color: var(--muted); }
  .profil svg { touch-action: none; }
</style>
</head>
<body>
<script>
(async function () {
  const F = 'Europe/Paris', avaitVue = location.hash.length > 1;   // une adresse qui porte déjà une vue la garde
  const app = await Socle.creer({
    id: 'corse', racine: '../', titre: 'Mes randos', sousTitre: 'Corse et France',
    centre: [9.2300, 41.9400], zoom: 9.4, pitch: 50, bearing: -20, pitch3d: 60,
    recherche: { centre: [2.5, 46.5], rayonKm: 1100 },
    signets: [
      { nom: 'Toute la Corse', centre: [9.10, 42.15], zoom: 7.7, pitch: 0, bearing: 0 },
      { nom: 'Toute la France', note: 'un point par rando ; les tracés viennent en zoomant', centre: [2.6, 46.4], zoom: 4.9, pitch: 0, bearing: 0 },
      { nom: 'Aiguilles de Bavella', note: 'le col, 1 218 m', centre: [9.2244, 41.7961], zoom: 13.2, pitch: 62, bearing: -30 },
      { nom: 'Monte Incudine', note: 'le sommet du sud', centre: [9.2073, 41.8494], zoom: 13.2, pitch: 62, bearing: 20 },
      { nom: 'Monte Renoso', centre: [9.1334, 42.0597], zoom: 13, pitch: 62, bearing: -20 },
      { nom: 'Monte d\'Oro et Vizzavona', centre: [9.0983, 42.1374], zoom: 12.8, pitch: 62, bearing: 150 },
      { nom: 'Lac de Melo', note: 'vallée de la Restonica', centre: [9.0226, 42.2132], zoom: 13.6, pitch: 62, bearing: -140 },
      { nom: 'Monte Rotondo', centre: [9.0579, 42.2161], zoom: 13, pitch: 62, bearing: 30 },
      { nom: 'Monte Cinto', note: 'le toit de l\'île', centre: [8.9459, 42.3795], zoom: 12.8, pitch: 62, bearing: -40 }
    ],
    sources: 'Itinéraires : mes tours Komoot partis de France (et les GPX déposés), préparés par relais/randos.py ; hors de Corse, chaque tracé est rogné de 400 m à ses deux bouts (distance, dénivelés, et, quand Komoot les donne, type de chemin et nature du sol). Les altitudes du profil sont celles du GPX ; les dénivelés ne comptent une montée ou une descente qu\'au-delà de 3 m. Relief : LiDAR HD de l\'IGN là où il existe, relief mondial ailleurs. Photo aérienne et plan : IGN. Souvenirs de terrain, pas un topo : un sentier a pu changer depuis.'
  });
  const { map } = app, P = app.propre;
  const km = v => (v >= 100 ? Math.round(v) : v.toFixed(1).replace('.', ',')) + ' km';
  const milliers = v => Math.round(v).toLocaleString('fr-FR');

  // ---------- Les randos ----------
  let randos = [];
  try { const r = await fetch('randos.geojson?' + Math.floor(Date.now() / 6e5)); if (r.ok) randos = (await r.json()).features || []; } catch (e) { randos = []; }
  /* Pour chaque rando : distance cumulée (km) et pente le long du tracé (%, lissée sur 150 m environ : le GPX de Komoot
     porte des altitudes en marches, la pente d'un point à l'autre n'aurait pas de sens). */
  for (const f of randos) {
    const c = f.geometry.coordinates, d = [0];
    for (let i = 1; i < c.length; i++) d.push(d[i - 1] + app.distKm(c[i - 1], c[i]));
    const p = new Float32Array(c.length);
    for (let i = 0, a = 0, b = 0; i < c.length; i++) {
      while (a < i && d[i] - d[a] > 0.075) a++; while (b < c.length - 1 && d[b] - d[i] < 0.075) b++;
      const l = (d[b] - d[a]) * 1000; p[i] = l > 20 ? (c[b][2] - c[a][2]) / l * 100 : 0;
    }
    f.d = d; f.pente = p; f.total = d[d.length - 1];
    let o = Infinity, s = Infinity, e = -Infinity, n = -Infinity; for (const q of c) { o = Math.min(o, q[0]); e = Math.max(e, q[0]); s = Math.min(s, q[1]); n = Math.max(n, q[1]); }
    f.bornes = [o, s, e, n];
  }

  /* Couleurs du tracé. Chaque mode range les points en classes ; le tracé est découpé en tronçons d'une même classe.
     « Sol » et « Chemin » n'existent que pour les randos dont Komoot a donné le détail (props.sol, props.chemin). */
  const PENTES = [[-1e9, '#3a86c8', 'descente raide'], [-25, '#7fb8dc', 'descente'], [-8, '#e9e2c8', 'presque plat'], [8, '#f2a65a', 'montée'], [25, '#e63946', 'montée raide']];
  const ALTIS = [[0, '#7fb069'], [500, '#c9c46a'], [1000, '#e0a458'], [1500, '#c9744a'], [2000, '#f3ead2']];
  const NOMS = {   // codes de Komoot ; un code inconnu est affiché tel quel
    asphalt: 'asphalte', paved: 'pierres plates', concrete: 'béton', paving_stones: 'pavés', cobbles: 'pavés ronds', cobblestone: 'pavés ronds', flagstone: 'pierres plates',
    compacted: 'stabilisé', gravel: 'gravier', fine_gravel: 'gravillon', unpaved: 'non revêtu', ground: 'terre', nature: 'chemin naturel', natural: 'chemin naturel',
    sand: 'sable', alpine: 'alpin', alpin: 'alpin', rock: 'rocher', grass: 'herbe', wood: 'bois', unknown: 'inconnu',
    way: 'chemin', path: 'sentier', footway: 'voie piétonne', trail: 'sentier', hike_d1: 'sentier de randonnée', hike_d2: 'sentier de randonnée', hike_d3: 'sentier de montagne',
    hike_d4: 'sentier de montagne', hike_d5: 'sentier de montagne', hike_d6: 'sentier de montagne exigeant', hike_d7: 'sentier alpin', street: 'route', minor_road: 'rue', service: 'voie de desserte',
    cycleway: 'piste cyclable', state_road: 'nationale', primary: 'route principale', steps: 'escaliers', ferry: 'bac'
  };
  const TEINTES = ['#b8963e', '#2a9d8f', '#e63946', '#7fb8dc', '#f2a65a', '#a78bca', '#8d99ae', '#c9c46a'];
  // À l'ouverture : la rando la plus récente de la vue affichée, sinon la plus récente tout court.
  const vue0 = map.getBounds(), dedans = randos.findIndex(r => r.bornes[0] < vue0.getEast() && r.bornes[2] > vue0.getWest() && r.bornes[1] < vue0.getNorth() && r.bornes[3] > vue0.getSouth());
  const etat = { choisie: randos.length ? Math.max(0, dedans) : -1, mode: 'pente' };
  function classes(f, mode) {
    const c = f.geometry.coordinates, n = c.length, k = new Int16Array(n);
    if (mode === 'pente') { for (let i = 0; i < n; i++) { let j = 0; while (j < PENTES.length - 1 && f.pente[i] >= PENTES[j + 1][0]) j++; k[i] = j; } return { k, items: PENTES.map((q, j) => ({ cle: j, couleur: q[1], texte: q[2] })) }; }
    if (mode === 'alti') { for (let i = 0; i < n; i++) { let j = 0; while (j < ALTIS.length - 1 && c[i][2] >= ALTIS[j + 1][0]) j++; k[i] = j; } return { k, items: ALTIS.map((q, j) => ({ cle: j, couleur: q[1], texte: j < ALTIS.length - 1 ? `${q[0]} à ${ALTIS[j + 1][0]} m` : `plus de ${milliers(q[0])} m` })) }; }
    const tr = f.properties[mode] || [], codes = [...new Set(tr.map(t => t[2]))]; k.fill(-1);
    for (const t of tr) for (let i = t[0]; i <= Math.min(n - 1, t[1]); i++) k[i] = codes.indexOf(t[2]);
    return { k, items: codes.map((code, j) => ({ cle: j, couleur: TEINTES[j % TEINTES.length], texte: NOMS[code] || code })) };
  }
  // Kilomètres par classe, pour la légende.
  function longueurs(f, cl) { const l = {}; for (let i = 1; i < cl.k.length; i++) l[cl.k[i]] = (l[cl.k[i]] || 0) + f.d[i] - f.d[i - 1]; return l; }

  function donnees() {
    const fc = { type: 'FeatureCollection', features: [] };
    randos.forEach((f, i) => {
      const c = f.geometry.coordinates, on = i === etat.choisie;
      fc.features.push({ type: 'Feature', properties: { r: 'loin', i, on }, geometry: { type: 'Point', coordinates: c[c.length >> 1] } });
      fc.features.push({ type: 'Feature', properties: { r: 'bord', i, on }, geometry: { type: 'LineString', coordinates: c } });
      if (!on) { fc.features.push({ type: 'Feature', properties: { r: 'ligne', i, on, couleur: '#e63946' }, geometry: { type: 'LineString', coordinates: c } }); return; }
      const cl = classes(f, etat.mode), teinte = j => j < 0 ? '#8d99ae' : cl.items[j].couleur;
      for (let a = 0; a < c.length - 1;) { let b = a + 1; while (b < c.length - 1 && cl.k[b] === cl.k[a]) b++; fc.features.push({ type: 'Feature', properties: { r: 'ligne', i, on, couleur: teinte(cl.k[a]) }, geometry: { type: 'LineString', coordinates: c.slice(a, b + 1) } }); a = b; }
      fc.features.push({ type: 'Feature', properties: { r: 'depart', i }, geometry: { type: 'Point', coordinates: c[0] } }, { type: 'Feature', properties: { r: 'arrivee', i }, geometry: { type: 'Point', coordinates: c[c.length - 1] } });
    });
    if (etat.repere) fc.features.push({ type: 'Feature', properties: { r: 'repere' }, geometry: { type: 'Point', coordinates: etat.repere } });
    return fc;
  }
  const dessiner = () => map.getSource('randos').setData(donnees());
  map.addSource('randos', { type: 'geojson', data: donnees() });
  /* De loin, des dizaines de tracés feraient un fouillis : ils n'arrivent qu'à l'échelle d'une région (zoom 7), et
     chaque rando n'est d'abord qu'un point discret, que l'on touche pour s'y rendre. */
  const rond = { 'line-cap': 'round', 'line-join': 'round' }, ZMIN = 7;
  map.addLayer({ id: 'randos-bord', type: 'line', source: 'randos', filter: ['==', ['get', 'r'], 'bord'], layout: rond, paint: { 'line-color': ['case', ['get', 'on'], '#10192a', '#ffffff'], 'line-width': ['interpolate', ['linear'], ['zoom'], 7, ['case', ['get', 'on'], 2.6, 1.8], 13, ['case', ['get', 'on'], 5.5, 3.6]], 'line-opacity': ['interpolate', ['linear'], ['zoom'], ZMIN - 0.6, 0, ZMIN, ['case', ['get', 'on'], 0.85, 0.7]] } });
  map.addLayer({ id: 'randos-ligne', type: 'line', source: 'randos', filter: ['==', ['get', 'r'], 'ligne'], layout: rond, paint: { 'line-color': ['get', 'couleur'], 'line-width': ['interpolate', ['linear'], ['zoom'], 7, ['case', ['get', 'on'], 1.4, 0.9], 13, ['case', ['get', 'on'], 3, 1.8]], 'line-opacity': ['interpolate', ['linear'], ['zoom'], ZMIN - 0.6, 0, ZMIN, 1] } });
  map.addLayer({ id: 'randos-loin', type: 'circle', source: 'randos', filter: ['==', ['get', 'r'], 'loin'], maxzoom: ZMIN, paint: { 'circle-radius': ['case', ['get', 'on'], 4.5, 3], 'circle-color': ['case', ['get', 'on'], '#b8963e', '#e63946'], 'circle-stroke-color': '#fff', 'circle-stroke-width': 1, 'circle-opacity': 0.9 } });
  map.addLayer({ id: 'randos-points', type: 'circle', source: 'randos', minzoom: ZMIN - 0.6, filter: ['all', ['==', ['geometry-type'], 'Point'], ['!=', ['get', 'r'], 'loin']],
    paint: { 'circle-radius': ['match', ['get', 'r'], 'repere', 7, 4], 'circle-color': ['match', ['get', 'r'], 'depart', '#2a9d8f', 'arrivee', '#b8963e', '#e63946'], 'circle-stroke-color': '#fff', 'circle-stroke-width': 1.5 } });
  // Un tracé fin se touche mal : une bande invisible, plus large, prend le doigt.
  map.addLayer({ id: 'randos-doigt', type: 'line', source: 'randos', filter: ['==', ['get', 'r'], 'bord'], minzoom: ZMIN - 0.6, paint: { 'line-color': '#000', 'line-opacity': 0, 'line-width': 22 } });

  // Profil : la courbe prend les couleurs du tracé ; le doigt y promène un repère, reporté sur la carte.
  function profil(f, cl) {
    const c = f.geometry.coordinates, W = 320, H = 104, mg = 4, z0 = Math.floor(f.properties.altmin / 100) * 100, z1 = Math.max(z0 + 100, Math.ceil(f.properties.altmax / 100) * 100);
    const X = s => mg + (W - 2 * mg) * s / f.total, Y = z => H - 14 - (H - 26) * (z - z0) / (z1 - z0), pas = Math.max(1, Math.floor(c.length / 400));
    let aire = '', traits = '';
    for (let i = 0; i < c.length; i += pas) aire += (i ? 'L' : 'M') + X(f.d[i]).toFixed(1) + ' ' + Y(c[i][2]).toFixed(1);
    for (let a = 0; a < c.length - 1;) {
      let b = a + 1; while (b < c.length - 1 && cl.k[b] === cl.k[a]) b++;
      let t = ''; for (let i = a; i <= b; i += (i < b && i + pas > b ? b - i : pas)) t += (t ? 'L' : 'M') + X(f.d[i]).toFixed(1) + ' ' + Y(c[i][2]).toFixed(1);
      traits += `<path d="${t}" fill="none" stroke="${cl.k[a] < 0 ? '#8d99ae' : cl.items[cl.k[a]].couleur}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`; a = b;
    }
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Profil de la rando" style="display:block;margin:4px 0">
      <path d="${aire}L${X(f.total).toFixed(1)} ${H - 14}L${mg} ${H - 14}Z" fill="currentColor" opacity="0.12"/>${traits}
      <line class="curseur" x1="0" x2="0" y1="6" y2="${H - 14}" stroke="currentColor" stroke-width="1" opacity="0"/>
      <text x="${mg}" y="10" font-size="9" fill="currentColor" opacity="0.75">${milliers(f.properties.altmax)} m</text>
      <text x="${mg}" y="${H - 3}" font-size="9" fill="currentColor" opacity="0.75">${milliers(f.properties.altmin)} m · départ</text>
      <text x="${W - mg}" y="${H - 3}" font-size="9" fill="currentColor" opacity="0.75" text-anchor="end">${km(f.total)}</text></svg>`;
  }
  const barres = (titre, lignes) => { const max = Math.max(...lignes.map(l => l[1])); return `<b>${P(titre)}</b>` + lignes.map(l => `<div><span>${P(l[0])}</span><span><i style="width:${Math.max(1, l[1] / max * 100).toFixed(0)}%"></i></span><span>${l[1] < 0.1 ? '< 100 m' : km(l[1])}</span></div>`).join(''); };

  // Survol : la caméra suit le tracé, tournée vers la suite du chemin.
  let vol = null;
  const arreter = () => { if (vol) { cancelAnimationFrame(vol.raf); vol = null; const b = document.querySelector('.reponse .survol'); if (b) { b.setAttribute('aria-pressed', 'false'); b.textContent = 'Survoler'; } } };
  const indiceA = (f, s) => { let a = 0, b = f.d.length - 1; while (b - a > 1) { const m = (a + b) >> 1; f.d[m] < s ? a = m : b = m; } return a; };
  function survoler(f, bouton, suivre) {
    if (vol) { arreter(); return; }
    if (!app.relief3d) app.mettre3d(true);
    const c = f.geometry.coordinates, duree = Math.min(120000, Math.max(20000, f.total * 1300));
    let t0 = null, cap = map.getBearing(); vol = { raf: 0 }; bouton.setAttribute('aria-pressed', 'true'); bouton.textContent = 'Arrêter';
    const pas = t => {
      if (!vol) return; if (t0 === null) t0 = t;
      const u = Math.min(1, (t - t0) / duree), s = u * f.total, i = indiceA(f, s), j = indiceA(f, Math.min(f.total, s + 1.5)), r = Math.PI / 180;
      const y = Math.sin((c[j][0] - c[i][0]) * r) * Math.cos(c[j][1] * r), x = Math.cos(c[i][1] * r) * Math.sin(c[j][1] * r) - Math.sin(c[i][1] * r) * Math.cos(c[j][1] * r) * Math.cos((c[j][0] - c[i][0]) * r);
      if (j > i) cap += ((((Math.atan2(y, x) / r - cap) % 360) + 540) % 360 - 180) * 0.03;
      map.jumpTo({ center: [c[i][0], c[i][1]], zoom: 13.2, pitch: 62, bearing: cap }); suivre(i);
      if (u < 1) vol.raf = requestAnimationFrame(pas); else arreter();
    };
    vol.raf = requestAnimationFrame(pas);
  }
  map.on('dragstart', arreter);

  function cadrer(f) {
    let o = Infinity, s = Infinity, e = -Infinity, n = -Infinity; for (const p of f.geometry.coordinates) { o = Math.min(o, p[0]); e = Math.max(e, p[0]); s = Math.min(s, p[1]); n = Math.max(n, p[1]); }
    map.fitBounds([[o, s], [e, n]], { padding: { top: 90, bottom: Math.round(innerHeight * 0.45), left: 40, right: 70 }, pitch: app.relief3d ? 50 : 0, bearing: map.getBearing(), duration: 1600 });
  }

  const qRandos = {
    theme: 'Randos', libelle: 'Où suis-je passé ?',
    aide: 'Mes itinéraires, drapés sur le relief. De loin, chaque rando est un point ; les tracés arrivent à l\'échelle d\'une région, et la liste ne porte que les randos de la vue affichée. Le tracé choisi se colore selon la pente le long du chemin, l\'altitude, ou, quand Komoot en donne le détail, la nature du sol et le type de chemin. La pente est celle du sentier (lissée sur 150 m), pas celle du versant.',
    ouvrir(app) {
      if (!randos.length) { app.repondre(qRandos.libelle, '<p class="etat">Aucune rando pour l\'instant : dépose un GPX dans corse/gpx/ puis lance relais/randos.py.</p>'); return; }
      const f = randos[etat.choisie], p = f.properties;
      // La liste ne porte que les randos de la vue affichée (et celle qui est choisie) ; toutes, si la vue n'en contient pas d'autre.
      const v = map.getBounds(), vues = randos.map((r, i) => [r, i]).filter(([r, i]) => i === etat.choisie || (r.bornes[0] < v.getEast() && r.bornes[2] > v.getWest() && r.bornes[1] < v.getNorth() && r.bornes[3] > v.getSouth()));
      const proches = vues.length > 1 ? vues : randos.map((r, i) => [r, i]);
      const modes = [['pente', 'Pente'], ['alti', 'Altitude']].concat(p.sol && p.sol.length ? [['sol', 'Sol']] : [], p.chemin && p.chemin.length ? [['chemin', 'Chemin']] : []);
      if (!modes.some(m => m[0] === etat.mode)) etat.mode = 'pente';
      const cl = classes(f, etat.mode), date = p.date ? new Date(p.date + 'T12:00').toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }) : '';
      const c = app.repondre(randos.length > 1 ? qRandos.libelle : p.nom, `
        ${randos.length > 1 ? `<div class="puces randos-liste" style="margin-bottom:6px">${proches.map(([r, i]) => `<button data-i="${i}" aria-pressed="${i === etat.choisie}">${P(r.properties.nom)}<small>${km(r.total)} · +${milliers(r.properties.dplus)} m${r.properties.date ? ' · ' + r.properties.date.slice(0, 4) : ''}${r.properties.prevu ? ' · prévu' : ''}</small></button>`).join('')}</div>` : ''}
        <p class="etat"><span class="fort">${km(f.total)}</span>, <span class="fort">+${milliers(p.dplus)} m</span> / −${milliers(p.dmoins)} m, point haut ${milliers(p.altmax)} m${date ? ', ' + P(date) : ''}.</p>
        <div class="profil">${profil(f, cl)}</div>
        <div class="puces">${modes.map(m => `<button data-m="${m[0]}" aria-pressed="${m[0] === etat.mode}">${m[1]}</button>`).join('')}<button class="cadre">Voir en entier</button><button class="survol" aria-pressed="false">Survoler</button></div>
        <div class="legende"></div>
        ${p.bilan && !(p.sol && p.sol.length) ? `<div class="barres">${p.bilan.sol ? barres('Nature du sol', p.bilan.sol) : ''}${p.bilan.chemin ? barres('Type de chemin', p.bilan.chemin) : ''}</div><p class="petit">Sol et chemin : totaux de la page Komoot du tour. Leur détail le long du tracé arrivera quand le relais aura pu interroger Komoot.</p>` : ''}`);
      const l = longueurs(f, cl);
      c.querySelector('.legende').innerHTML = cl.items.filter(it => l[it.cle] > 0.05).map(it => `<span><i style="background:${it.couleur}"></i>${P(it.texte)} · ${km(l[it.cle])}</span>`).join('');
      c.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => { arreter(); etat.choisie = +b.dataset.i; etat.repere = null; dessiner(); qRandos.ouvrir(app); cadrer(randos[etat.choisie]); });
      c.querySelectorAll('button[data-m]').forEach(b => b.onclick = () => { etat.mode = b.dataset.m; dessiner(); qRandos.ouvrir(app); });
      c.querySelector('.cadre').onclick = () => { arreter(); cadrer(f); };
      const svg = c.querySelector('.profil svg'), cur = svg.querySelector('.curseur'), phrase = c.querySelector('.etat'), repos = phrase.innerHTML;
      const montrer = i => {
        const q = f.geometry.coordinates[i], x = 4 + 312 * f.d[i] / f.total; cur.setAttribute('x1', x); cur.setAttribute('x2', x); cur.setAttribute('opacity', '0.7');
        const j = cl.k[i]; phrase.innerHTML = `km <span class="fort">${f.d[i].toFixed(1).replace('.', ',')}</span> · ${milliers(q[2])} m · pente ${f.pente[i] > 0 ? '+' : ''}${Math.round(f.pente[i])} %${etat.mode !== 'pente' && etat.mode !== 'alti' && j >= 0 ? ' · ' + P(cl.items[j].texte) : ''}`;
        etat.repere = [q[0], q[1]]; dessiner();
      };
      const doigt = e => { if (vol) return; const r = svg.getBoundingClientRect(), s = Math.max(0, Math.min(1, ((e.clientX - r.left) / r.width * 320 - 4) / 312)) * f.total; montrer(indiceA(f, s)); };
      svg.addEventListener('pointerdown', doigt); svg.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) doigt(e); });
      svg.addEventListener('pointerleave', () => { if (!vol) { cur.setAttribute('opacity', '0'); phrase.innerHTML = repos; etat.repere = null; dessiner(); } });
      c.querySelector('.survol').onclick = e => survoler(f, e.currentTarget, montrer);
    },
    fermer() { arreter(); etat.repere = null; dessiner(); }
  };
  app.question(qRandos);
  // Toucher un tracé le choisit (sauf pendant qu'on dessine un itinéraire : le toucher y pose un point).
  const prendre = (e, aller) => {
    if (app.active && app.active !== qRandos) return;
    const i = e.features[0].properties.i; if (i !== etat.choisie) { etat.choisie = i; etat.repere = null; dessiner(); }
    if (app.active === qRandos) qRandos.ouvrir(app); else app.choisir(qRandos);
    if (aller) cadrer(randos[i]);
  };
  map.on('click', 'randos-doigt', e => prendre(e, false));
  map.on('click', 'randos-loin', e => prendre(e, true));   // de loin, toucher le point d'une rando y conduit

  // ---------- La lumière sur le relief, le ciel, et un itinéraire à préparer ----------
  const famille = (nom, q) => app.question(Object.assign(q, { famille: nom }));
  famille('Lumière', Socle.lumiere.lumiere({ fuseau: F, theme: 'Ombres' }));
  famille('Lumière', Socle.lumiere.rasante({ fuseau: F }));
  famille('Lumière', Socle.lumiere.anneau({ fuseau: F }));
  app.question(Socle.lumiere.nuages({ fuseau: F, theme: 'Ciel' }));
  app.question(Socle.trace({ cle: 'corse', nom: 'Itinéraire en Corse', theme: 'Préparer', libelle: 'Par où passer la prochaine fois ?', sentiers: true, seuilPente: false,
    intro: 'Touche la carte pour poser le départ, puis chaque étape : le tracé suit les sentiers. Le fond « Carte 25 » les montre le mieux.', pied: 'Tracé calculé sur les sentiers de la BD TOPO.' }));

  if (randos.length) { app.choisir(qRandos); if (!avaitVue) cadrer(randos[etat.choisie]); }
})();
</script>
