<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>La Réunion — où est la lumière</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="../socle/socle.css">
<script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>
<script src="../socle/socle.js"></script>
<script src="../socle/soleil.js"></script>
<script src="../socle/drone.js"></script>
<script src="../socle/arbres.js"></script>
<script src="../socle/trace.js"></script>
<script src="../socle/cetaces.js"></script>
</head>
<body>
<script>
(async function () {
  const F = 'Indian/Reunion';
  const app = await Socle.creer({
    id: 'reunion', racine: '../', titre: 'Où est la lumière', sousTitre: 'La Réunion',
    photo: 'ORTHOIMAGERY.ORTHOPHOTOS2022',   // la dernière BD ORTHO est voilée sur les sommets (Piton des Neiges, Salazes) ; 2022 y est nette
    geologie: false, fondsExclus: ['etatmajor', 'cassini'],   // la carte géologique du BRGM et les cartes anciennes ne couvrent que la métropole
    centre: [55.4700, -21.0950], zoom: 11.3, pitch: 55, bearing: 20, pitch3d: 60,
    recherche: { centre: [55.53, -21.13], rayonKm: 60 },
    signets: [
      { nom: 'Toute l\'île', centre: [55.535, -21.125], zoom: 9.7, pitch: 0, bearing: 0 },
      { nom: 'Mafate, vu du Maïdo', note: 'le cirque sans route', centre: [55.4180, -21.0700], zoom: 12.6, pitch: 62, bearing: 70 },
      { nom: 'Cilaos', centre: [55.4700, -21.1330], zoom: 12.6, pitch: 60, bearing: 0 },
      { nom: 'Salazie et Hell-Bourg', centre: [55.5210, -21.0660], zoom: 12.6, pitch: 60, bearing: -150 },
      { nom: 'Piton des Neiges', note: '3 070 m, le toit de l\'île', centre: [55.4800, -21.0994], zoom: 13.2, pitch: 65, bearing: -60 },
      { nom: 'Col du Taïbit', centre: [55.4326, -21.1128], zoom: 13.6, pitch: 62, bearing: -20 },
      { nom: 'Trou de Fer', centre: [55.5555, -21.0397], zoom: 13.6, pitch: 62, bearing: 170 },
      { nom: 'Piton de la Fournaise', note: 'depuis le Pas de Bellecombe', centre: [55.7050, -21.2360], zoom: 12.8, pitch: 62, bearing: 110 },
      { nom: 'Cap Méchant', note: 'la côte sauvage du sud', centre: [55.7109, -21.3760], zoom: 14, pitch: 55, bearing: 160 }
    ],
    sources: 'Relief : LiDAR HD de l\'IGN, lu à la volée ; en vue rapprochée, le calcul prend le modèle de surface, donc les arbres et les bâtiments portent ombre. Photo aérienne : IGN, prise de vue de 2022 (la plus récente est voilée sur les sommets) ; plan : IGN. La position du soleil est calculée (précision de l\'ordre du demi-degré), les heures sont celles de La Réunion. Les nuages, qui montent dans les cirques en fin de matinée, ne sont pas pris en compte. Baleines et dauphins : observations de Globice (2008-2018) et grille de prospection (2008-2022), publiées sur Sextant (Ifremer).'
  });
  // Trois familles : la lumière (ombres à une heure, lumière rasante, course du soleil), le ciel, le drone.
  // Les heures de soleil d'un point se lisent dans « Soleil » (premier et dernier rayon) ou en touchant la carte dans « Ombres ».
  const famille = (nom, q) => app.question(Object.assign(q, { famille: nom }));
  famille('Lumière', Socle.lumiere.lumiere({ fuseau: F, theme: 'Ombres', note: 'Sous les tropiques, le soleil passe au nord une grande partie de l\'année, et presque à la verticale en été austral.' }));
  famille('Lumière', Socle.lumiere.rasante({ fuseau: F, noteRasante: 'Dans les cirques, le soleil bas du matin n\'atteint que les hauts de rempart tournés vers l\'est.' }));
  famille('Lumière', Socle.lumiere.anneau({ fuseau: F }));
  app.question(Socle.lumiere.nuages({ fuseau: F, theme: 'Ciel' }));
  famille('Drone', Socle.drone.camera({ cle: 'reunion', nom: 'Plan de vol — La Réunion', theme: 'Caméra' }));
  famille('Drone', Socle.drone.vol({ fuseau: F }));
  famille('Drone', Socle.arbres.cimes());
  // Baleines et dauphins : observations de Globice, avec l'effort de sortie (grille de 2 km), d'où une fréquence corrigée.
  app.question(Socle.cetaces.theme({
    url: 'baleines.json', vue: { center: [55.25, -21.12], zoom: 10.4 },
    especes: [
      { k: 'B', nom: 'Baleine à bosse', col: 3, dessin: 'bosse', saison: 'Elles sont là de juin à octobre, le gros de la saison de juillet à septembre' },
      { k: 'I', nom: 'Grand dauphin de l\'Indo-Pacifique', col: 7, dessin: 'dauphin', note: 'Toute l\'année, près du bord, surtout sur la côte ouest.' },
      { k: 'L', nom: 'Dauphin à long bec', col: 4, dessin: 'longbec', note: 'En grands bancs, connus pour leurs sauts en vrille.' },
      { k: 'G', nom: 'Grand dauphin', col: 6, dessin: 'dauphin', note: 'Plus gros, plus au large que son cousin de l\'Indo-Pacifique.' },
      { k: 'T', nom: 'Dauphin tacheté', col: 5, dessin: 'tachete', note: 'Au large, plus rarement vu.' },
      { k: 'R', nom: 'Autres espèces', col: 0, dessin: 'autre', note: 'Espèces plus rares : cachalot, globicéphale, baleine à bec…' }
    ],
    regles: `· moteur au point mort à moins de <b>100 m</b> d'une baleine, <b>50 m</b> d'un dauphin ;<br>
      · à moins de 300 m : <b>4 nœuds</b> au plus, <b>trois bateaux</b> au plus ;<br>
      · <b>drone</b> aérien ou sous-marin : jamais à moins de <b>100 m</b> des animaux ;<br>
      · du 1er juillet au 30 septembre : observation de 9 h à 16 h, mise à l'eau de 9 h à 13 h, à 15 m au moins, jamais dans la réserve marine.`,
    source: 'Observations de Globice, 2008-2018 ; grille de prospection 2008-2022 (Sextant, Ifremer).',
    aide: 'Les données sont celles de Globice, l\'association réunionnaise qui suit les cétacés en mer depuis 2008, publiées en données ouvertes sur Sextant (Ifremer). Les couleurs disent où l\'on voit l\'espèce le plus souvent, en observations pour 100 km parcourus par les bateaux de Globice, sur la grille de 2 km de 2008 à 2022 : l\'effort de sortie est pris en compte, une zone très fréquentée par les bateaux n\'est donc pas avantagée. Une maille peu parcourue est ramenée vers la moyenne de l\'île, et celles de moins de 25 km parcourus ne sont pas peintes : les sorties partent surtout de la côte ouest, le reste de l\'île est peu connu, ce qui ne veut pas dire sans animaux. Les plages de couleur sont lissées entre mailles voisines, pour montrer des secteurs plutôt qu\'un damier. Chaque point est une rencontre du mois choisi, toutes années de 2008 à 2018 confondues ; en rose, un petit accompagnait l\'animal. La frise des mois compte les observations par sortie en mer, pour ne pas confondre la saison des baleines avec celle des bateaux, qui sortent bien plus en juillet et en août. Les animaux en mouvement sont un décor : ils nagent dans les mailles où l\'espèce est le plus souvent vue, en nombre suivant le mois, mais ne disent pas où sont les animaux aujourd\'hui. Règles d\'approche : résumé de l\'arrêté préfectoral n° 1098 du 27 juin 2025 et de son projet publié par l\'État ; seul le texte officiel fait foi.'
  }));
  app.question(Socle.trace({ cle: 'reunion-rando', nom: 'Randonnée à La Réunion', theme: 'Préparer', libelle: 'Par où passer ?', sentiers: true, seuilPente: false,
    intro: 'Touche la carte pour poser le départ, puis chaque étape : le tracé suit les sentiers. Le fond « Carte 25 » les montre le mieux.', pied: 'Tracé calculé sur les sentiers de la BD TOPO.' }));
})();
</script>
</body>
</html>
